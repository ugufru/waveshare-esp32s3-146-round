<script id="snapshot" type="application/json">{"issues": [{"id": 1, "summary": "Record board specs and check the case against them", "description": "Collected the Waveshare ESP32-S3-Touch-LCD-1.46 specs, schematic and structural drawings (docs/datasheets/) and measured Case_Top.stl and Case_back.stl by slicing them in Python (no CAD tool available). Results and a fit table are in docs/board-specs.md. STEP models were downloaded but not committed (about 15 MB each); their URLs are in the doc. Findings were filed as issues 2 to 11. Left open only for the user to review the doc.", "type": "docs", "status": "in-progress", "priority": "medium", "file": "docs/board-specs.md", "tags": ["docs", "fit-check"], "created": "2026-09-28", "updated": "2026-09-28"}, {"id": 2, "summary": "Correct the README: board is a 1.46in IPS LCD, not a 1.43in AMOLED, and the case fits the cover-glass SKU only", "description": "hardware/README.txt (copied from Thingiverse thing 7386073) describes the board as a '1.43-inch 412x412 Round AMOLED'. That is the ESP32-S3-Touch-AMOLED-1.43. The ESP32-S3-Touch-LCD-1.46 is a 1.46in IPS LCD with an SPD2010 driver. Also state which SKU fits: the front aperture is 41.6 dia (Case_Top.stl, z 0 to 1). The cover-glass 1.46 (SKU 29565) has a 44.77 lens and seats on the ledge. The glassless 1.46B (SKU 29564) is 39.36 across and would fall straight through. Either document 'fits 29565 only' or add a 1.46B variant (see issue 11). Keep the original Thingiverse text and attribution (CC BY-SA).", "type": "docs", "status": "open", "priority": "high", "file": "hardware/README.txt", "tags": ["docs", "compatibility"], "created": "2026-09-28", "updated": "2026-09-28"}, {"id": 3, "summary": "New pocket-watch case from the ground up (parametric OpenSCAD)", "description": "Scope changed from 'reproduce the Thingiverse STLs' to a new design. Phase 1: a proper enclosure for the cover-glass 1.46 (SKU 29565) plus a 20 x 30 mm LiPo, round and pocket-watch styled, with a bow at 12 o'clock for a chain, closed with the M2.5 x 12 countersunk self-tapping screws from the xroar-waveshare-rp2350-pizero case.\n\nBuilt as pocketwatch/pocketwatch.scad (front.stl, back.stl, README.md). Coordinates are the Waveshare STEP model's, and board positions were measured from that model rather than the drawing. Key decisions: the board's standoffs are M2 female, so the M2.5 screws go into bosses in the case band, and posts on the caseback land on the standoff tips (pins in the bores, 0.1 mm preload) to clamp the glass against a 1.2 mm bezel lip. The display's FPC tab at 6 o'clock sits in a notch, which keys rotation so USB-C always lines up with its port. The USB-C plug pocket runs through the band to the receptacle face so plugs seat fully. The cell sits behind the 2x10 header in a cradle on the caseback. PWR is reached by a pinhole with a guide tube. Screw seat and 2.2 pilot carry over the lessons from the pizero case. The screw pattern is not 120 degree symmetric, so the back fits one way only.\n\nVerified: both parts render manifold; tools/fitcheck.py against the STEP mesh shows no contact except the intended preload at the standoff tips. Not verified: any real print. Open questions: the cell's actual size (5.0 thick assumed), standoff bore size, USB-C plug overmould fit. Follow-ups filed as issues 12 to 14. Issues 4, 5, 7 and 9 describe defects of the Thingiverse case that this design addresses by construction; close them once a print is confirmed.", "type": "feature", "status": "in-progress", "priority": "high", "file": "pocketwatch/pocketwatch.scad", "tags": ["cad", "source"], "created": "2026-09-28", "updated": "2026-09-28"}, {"id": 4, "summary": "Retain the board: it floats 1.0 mm radially and about 3 mm axially, and nothing uses the M2 standoffs", "description": "Bore is 46.8 dia against a 44.77 lens, so 1.0 mm radial play. Cavity is 14.0 deep (front plate top at z 1.0 to rim at z 15.0) against a 10.9 module, so about 3.1 mm axial play; the lid does not touch the board. The board is held by nothing and can rattle and rotate. The board has 3 x M2 brass standoffs, 3.5 high, at (0, +17.75), (-12.00, -14.95), (+11.54, -15.45) from display centre (docs/datasheets/*dimensions*.pdf). Options: posts on the lid that land on the standoffs with M2 x 4 screws through the lid; or lid posts that clamp the PCB against the ledge with a thin foam ring on the lens. Also tighten the bore to about 45.1 to 45.2, and fix rotation so USB-C always lines up with the window (currently the port face at r 23.0 is inside the r 23.4 bore and cannot key anything). Standoff-based location solves rotation too.\n\n[2026-10-01] Not pursued: this describes the Thingiverse case in hardware/, which was replaced by the pocket-watch design (issues 3, 15, 16). Kept for reference.", "type": "bug", "status": "wontfix", "priority": "high", "file": "hardware/files/Case_Top.stl", "tags": ["fit", "retention"], "created": "2026-09-28", "updated": "2026-10-01"}, {"id": 5, "summary": "Retain the lid: it rests on the rim and is held only by peg friction", "description": "Case_back.stl is a 52.0 x 1.8 disc with three edge notches that drop over 2.5 dia x 2.0 pegs on the rim (at 6.5, 131.5 and -118.8 deg, so orientation is keyed, which is good). Nothing holds it down, so the lid falls off if the case is tipped or picked up face-down. If issue 4 goes with screws through the lid into the standoffs, that also fixes this; otherwise use a twist-lock bayonet, snap tabs, or a press-fit lip into the 46.8 bore.\n\n[2026-10-01] Not pursued: this describes the Thingiverse case in hardware/, which was replaced by the pocket-watch design (issues 3, 15, 16). Kept for reference.", "type": "bug", "status": "wontfix", "priority": "medium", "file": "hardware/files/Case_back.stl", "tags": ["fit", "retention"], "created": "2026-09-28", "updated": "2026-10-01"}, {"id": 6, "summary": "Add ventilation: the README promises vent slots but the model has none", "description": "README says 'Passive thermal ventilation slots'. Slicing both STLs shows no openings other than the USB window (12.0 x 7.0 on the -X side). The lid is solid. An ESP32-S3 on Wi-Fi continuously plus an LCD backlight in a sealed PLA puck will run warm, and PLA softens around 55 to 60 C. Add slots in the lid (they can double as a speaker grille, issue 8) and ideally a low intake near the front so air can move. Measure the board temperature in the closed case before and after.", "type": "bug", "status": "open", "priority": "medium", "file": "hardware/files/Case_back.stl", "tags": ["thermal", "docs"], "created": "2026-09-28", "updated": "2026-09-28"}, {"id": 7, "summary": "Check the USB-C window against real cable overmolds", "description": "The port face sits about 0.4 mm inside the bore plus the 2.6 wall, so the receptacle is about 3.0 mm behind the outer skin. The window is 12.0 wide x 7.0 tall, spanning z 5.6 to 12.6 from the front face. Whether a plug seats fully depends on where the receptacle's centre lands in z (not dimensioned on the Waveshare drawing; take it from the STEP) and on overmold size (commonly up to about 12 x 7). If the window is off-centre or too small, thin the wall locally to 1.2 mm around the port or enlarge the window. Test with a few cables including a chunky one. Also note there are small inward guide features around the window (z 7 to 11.9, near r 21.5); confirm they do not foul the PCB.\n\n[2026-10-01] Not pursued: this describes the Thingiverse case in hardware/, which was replaced by the pocket-watch design (issues 3, 15, 16). Kept for reference.", "type": "task", "status": "wontfix", "priority": "medium", "file": "hardware/files/Case_Top.stl", "tags": ["fit", "usb"], "created": "2026-09-28", "updated": "2026-10-01"}, {"id": 8, "summary": "Open paths to PWR/BOOT buttons, TF slot, speaker and mic", "description": "All of these are on the back of the PCB and are covered by the solid lid. PWR matters when running on battery; BOOT is needed for recovery flashing; the speaker and mic are muffled by a sealed lid about 3 mm away. Add small button plungers or pin holes over PWR and BOOT, a grille over the speaker and a hole over the mic. Positions come from the STEP or the dimension drawing.", "type": "feature", "status": "open", "priority": "low", "file": "hardware/files/Case_back.stl", "tags": ["access", "audio"], "created": "2026-09-28", "updated": "2026-09-28"}, {"id": 9, "summary": "Optional deeper back with room for a LiPo", "description": "The board has an MX1.25 2-pin 3.7 V LiPo connector and an onboard charger, but there is only about 3 mm spare depth behind the module and the 2x9 header takes the centre-right. A spacer ring or deeper lid variant (about 5 to 6 mm) would take a small cell such as a 502030. Depends on issue 3 and on the retention design in issue 4.\n\n[2026-10-01] Not pursued: this describes the Thingiverse case in hardware/, which was replaced by the pocket-watch design (issues 3, 15, 16). Kept for reference.", "type": "feature", "status": "wontfix", "priority": "low", "file": "hardware/files/Case_back.stl", "tags": ["battery"], "created": "2026-09-28", "updated": "2026-10-01"}, {"id": 10, "summary": "Add a desk stand or tilted foot", "description": "It is sold as a desktop radar/flight tracker, but the case is a flat 52 x 17 puck: it either lies face-up or rolls on its edge. Add a separate cradle or a flat-bottomed tilt foot (15 to 25 deg back) that routes the USB-C cable out the back. A separate part keeps the main case unchanged.", "type": "feature", "status": "open", "priority": "low", "file": "hardware/files/", "tags": ["desktop"], "created": "2026-09-28", "updated": "2026-09-28"}, {"id": 11, "summary": "Cosmetic front: chamfer the aperture and consider a 1.46B variant", "description": "The 41.6 aperture has a square 1.0 mm edge, about 2 mm outside the 37.56 viewable area. A 45 deg chamfer on the outer edge reduces shadowing at viewing angles and looks less printed. Separately, a 1.46B (no cover glass, 39.36 x 41.53 including the bottom tab, 9.0 thick) variant needs a smaller aperture (about 38) and a different ledge; worth doing only once issue 3 exists.", "type": "feature", "status": "open", "priority": "low", "file": "hardware/files/Case_Top.stl", "tags": ["cosmetic", "compatibility"], "created": "2026-09-28", "updated": "2026-09-28"}, {"id": 12, "summary": "Pocket-watch case: print, assemble and measure phase 1", "description": "Print front.stl and back.stl (PW-F v1, PW-B v1 engraved inside) and check: glass seats with no rattle and no crushing (0.1 mm post preload, pocketwatch.scad post_preload); pins find the M2 standoff bores (pin_d 1.4, standoff_bore_d is [?]); the cell fits the cradle (bat_t 5.0 assumed; for a 402030 set bat_t = 4.0 and the case gets 1 mm thinner); a USB-C cable seats fully; PWR responds through the pinhole; the three screw bosses take the M2.5 x 12 screws without splitting. Record measured values in the source as [M].\n\n[2026-09-28 first print] PW-F v1 / PW-B v1 printed. The module did not fit the front. The user's photo of the board back shows the outline is not fully round near USB-C (the display FPC tab and the area around the port). What exactly fouled was not recorded. Work restarted from the back: see issue 15 (backplate) and issue 16 (front refit).\n\n[2026-10-01] Closed: the v1 print happened and its result is recorded above (module did not fit PW-F v1). The work moved to issue 15 (back cup, done) and issue 16 (front refit).", "type": "task", "status": "done", "priority": "high", "file": "pocketwatch/pocketwatch.scad", "tags": ["pocketwatch", "fit"], "created": "2026-09-28", "updated": "2026-10-01"}, {"id": 13, "summary": "Pocket-watch case: crown and bow sit at the front face, not mid-depth", "description": "Phase 1 prints the crown and bow flat on the bed with the front face so the bow's layers run in the plane of the ring and a chain pulls along them. That puts them at z +1.2 to -2.8 on a 22.35 mm deep case, so from the side they sit forward of centre. A mid-depth bow would need supports or a separate part (for example a metal bow through a pendant hole). Decide after handling the phase 1 print.", "type": "feature", "status": "open", "priority": "low", "file": "pocketwatch/pocketwatch.scad", "tags": ["pocketwatch", "style"], "created": "2026-09-28", "updated": "2026-09-28"}, {"id": 14, "summary": "Pocket-watch case: BOOT button and speaker are blocked by the cell", "description": "BOOT (TS24CA at x 14.7, y -10.2 in STEP coordinates) and the 12 x 10 speaker (x 3.9..18.5, y -5..5) are behind the cell footprint, so neither gets a hole in phase 1. BOOT is only needed for recovery flashing (remove the back). If audio matters, the cell has to move or a smaller cell used, and the caseback needs a grille. There are also no vents; check temperature on the phase 1 print (issue 6).", "type": "feature", "status": "open", "priority": "low", "file": "pocketwatch/pocketwatch.scad", "tags": ["pocketwatch", "access", "audio"], "created": "2026-09-28", "updated": "2026-09-28"}, {"id": 15, "summary": "Backplate that the board screws to through its three M2 standoffs", "description": "New part PW-P v1 in pocketwatch/pocketwatch.scad (part=\"plate\", plate.stl). Replaces the v1 idea of posts clamping the board; the board is now fixed to the plate. 54.0 OD x 2.4 plate with three 5.4 dia seats, 2.59 tall, under the standoffs at (12.00,-14.95), (-11.54,-15.45), (0,17.75) [STEP coords, looking at the display]. Seat height is derived so the plate's inner face clears the 2x10 header tips (z -12.95) by 0.55; nothing else on the board is deeper. M2 countersunk holes (3.8 head, 90 degree seat sunk 0.5) through plate and seats. The standoffs are M2 female, so the M2.5 x 12 screws from the pizero case cannot be used here: M2 x 8 countersunk engages 3.01 of the 3.51 standoff (m2_len; asserted to stay between 1.5 and the PCB). The three M2.5 holes on the v1 screw circle are kept so the next front can close onto this plate. Fit check against the STEP mesh: contact only at the seat faces. Not yet printed. PWR and BOOT turned out to be side-actuated switches at the board edge (visible in the photo), so the v1 PWR pinhole in the back was wrong; access belongs in the band, handled with issue 16.\n\n[2026-09-28] The user's M2 screws do not go into the standoffs, so the Waveshare drawing's M2 callout does not match this board; the real thread is unknown (M1.6 suspected, unmeasured). Added a screwless variant PW-PP v1 (part=\"plate_pins\", plate_pins.stl): same plate and seats, no screw holes, a 1.0 dia x 2.0 pin with a 0.3 lead-in on each seat that drops into the standoff bore whatever the thread. Pins locate only; the board is held once the front closes onto the plate with the M2.5 screws. Fit check: contact only at the seat faces, pins clear. The screw variant (plate.stl) is unchanged and needs its m2_* parameters set once the thread is measured. Measure the standoff bore (inside jaws) to settle it.\n\n[2026-09-28] PW-PP confirmed: the pins line the board up. Grown into back cup v1.0 (part=\"back_cup\", back_cup.stl; \"v1.0\" engraved on the inside floor). Flat base 38.1 (1.5 in), 2 mm wall rising on a 45 degree flank with a 3 mm round into a 46.8 band, rim 0.2 below the glass back (z -1.8; inside floor to rim 11.7, height 14.1). Band 46.8 rather than glass-flush because the lower-left standoff reaches r 21.03 [S]. Bottom: through notch |x| 10.6 down to z -7.85 for the display FPC and frame (they reach r 24.2, beyond any wall), inner pockets either side and below, and a 9.6 x 3.9 USB-C opening (shell 8.94 x 3.25) centred on the shell, open into the notch because the frame ends 0.05 above the shell. The user asked for an 8 x 2 hole 6 mm below the glass: too small for the shell; the shell top is 5.9 below the glass. PWR/BOOT pin holes (2.6) at +/-34.7 deg, z -8.1, direction inferred from the photo [?]. Fit check vs STEP mesh: contact only at the seat faces; tightest gaps 0.30 pins in bores, 0.36 USB sides, 0.45 notch floor to PCB tab.\n\n[2026-09-28] v1.0 printed and fits well. The user read the bottom opening as USB + microSD, but the strip under USB-C is the display FPC [S]. Waveshare's onboard-resources diagram (item 13) puts the TF socket on the FRONT of the PCB, between board and display, entering from the 9 o'clock edge (looking at the screen); v1.0 had no opening there. v1.1 adds a microSD slot at 9 o'clock: 12.6 wide (card 11) centred on y -0.73, z -6.9..-4.2 (socket -6.8..-4.33 [S]), with a 1.2 45-degree flare outside for a fingernail. Engraving now \"v1.1\". Fit check unchanged: contact only at the seats. Not changed: the bottom notch, which is sized to the STEP FPC tab (19.6 wide, reaching r 24.2); the user's photo suggests the real strip may be nearer 14 wide, so it can be tightened once measured.\n\n[2026-10-01] Closed: the user printed back cup v1.1 and confirmed the devboard fits (\"still a bit rough around the edges, but the devboard fits and we can work with that for awhile\"). Delivered: pinned plate PW-PP, then back cup v1.0 and v1.1 (pocketwatch/back_cup.stl, part=\"back_cup\"). Not done, filed as issue 29: edge finish, and tightening the bottom notch to the real FPC tab once measured. The screw variant plate.stl is unused because the standoff thread is unknown (M2 screws do not fit).", "type": "feature", "status": "done", "priority": "high", "file": "pocketwatch/pocketwatch.scad", "tags": ["pocketwatch", "backplate"], "created": "2026-09-28", "updated": "2026-10-01"}, {"id": 16, "summary": "Front v2: refit the band to the module's real outline", "description": "PW-F v1 would not take the module. The board-back photo shows the outline is not round near USB-C. Before remodelling, find what actually touched (pizero lesson: diagnose before changing a dimension): measure glass OD at several angles, the FPC tab width, depth and how far it reaches below the glass, and the USB-C position, and compare with the STEP values in pocketwatch.scad (lens_d 44.78, tab x +/-10.0 to y -23.12, z -1.7..-7.4). Then build front v2 to close onto the backplate (issue 15), with PWR and BOOT pushers in the band (both switches are side-actuated at the board edge) and room for the battery decided afresh.", "type": "bug", "status": "open", "priority": "high", "file": "pocketwatch/pocketwatch.scad", "tags": ["pocketwatch", "fit"], "created": "2026-09-28", "updated": "2026-09-28"}, {"id": 17, "summary": "Choose and pin the firmware toolchain", "description": "Gate for all firmware work. Waveshare supports two routes (docs.waveshare.com/ESP32-S3-Touch-LCD-1.46, Arduino and ESP-IDF pages, read 2026-10-01): (a) Arduino-ESP32 core 3.0.2 to 3.1.1 with LVGL 8.3.10 and ESP32-audioI2S 2.0.0, versions strictly coupled; (b) ESP-IDF 5.4.1 or later with the esp_lcd_spd2010 component and LVGL from the component manager.\n\nThis machine has PlatformIO Core 6.1.19 (used by ~/github/xroar-waveshare-rp2350-pizero) and arduino-cli, no ESP32 platform and no ESP-IDF. The official PlatformIO espressif32 platform only ships Arduino core 2.x, so Arduino 3.x needs the community pioarduino platform (github.com/pioarduino/platform-espressif32), pinned to the release carrying Arduino 3.1.1.\n\nRecommendation: PlatformIO + pioarduino, Arduino 3.1.1, LVGL 8.3.10, all pinned by exact version in platformio.ini. It keeps the same build/flash/monitor flow and docs/BUILD.md conventions as the pizero project, and stays inside Waveshare's tested versions so their SPD2010 driver code can be used as reference unchanged. Alternative if Arduino gets in the way: framework = espidf under the same platform (IDF 5.4). Done when the decision is recorded here and a pinned platformio.ini builds an empty sketch for the board.\n\n[2026-10-01] Decision: PlatformIO (user confirmed). Plan: pioarduino platform pinned to the release carrying Arduino-ESP32 3.1.1, LVGL 8.3.10, board memory type qio_opi (W25Q128 quad flash + 8 MB octal PSRAM), 16 MB partitions.\nData point considered: github.com/mast4rbug/ESP32_CoCo2_Emulator (ESP32-S3 CoCo 2 emulator, CC BY-NC 4.0) pins the official platform espressif32@6.11.0, i.e. Arduino 2.x on IDF 4.4, says it breaks on newer Arduino, and uses memory_type dio_opi with min_spiffs.csv. That conflicts with Waveshare's SPD2010 driver, which needs Arduino 3.0.2..3.1.1 (QSPI panel IO is believed to be IDF 5 only; unverified). Chose 3.x: the display is the board-specific hard part, and porting emulator code from 2.x to 3.x is mostly include/API renames.\nRemaining for done: a pinned platformio.ini that builds an empty sketch for this board.\n\n[2026-10-04] platformio.ini added: env 'board', platform pioarduino 53.03.11 by release-zip URL (installed framework-arduinoespressif32 reports 3.1.1, tool-esptoolpy 4.8.5), board esp32-s3-devkitc-1 overridden with memory_type qio_opi, flash_mode qio, 16MB flash, default_16MB.csv, BOARD_HAS_PSRAM, ARDUINO_USB_MODE=1, ARDUINO_USB_CDC_ON_BOOT=1. src/main.cpp is an empty sketch; 'pio run' builds it (cold build about 130 s; RAM 6.3%, flash 5.0% of a 6.25 MB app slot). LVGL 8.3.10 is not in lib_deps yet: it is added with the display work (issue 22/24), pinned to 8.3.10. Toolchain notes in docs/BUILD.md. Waiting on the user to confirm before closing.\n\n[2026-10-04] Closed with the user's go-ahead. Delivered: pinned platformio.ini (pioarduino 53.03.11 / Arduino 3.1.1) that builds an empty sketch for this board, toolchain section of docs/BUILD.md. Not done here: LVGL 8.3.10 pin, which lands with issues 22/24.", "type": "task", "status": "done", "priority": "high", "file": "platformio.ini", "tags": ["firmware", "toolchain"], "created": "2026-10-01", "updated": "2026-10-04"}, {"id": 18, "summary": "First contact: identify the board on USB and back up the factory flash", "description": "First thing to do with the board plugged in, before anything is flashed. The ESP32-S3 USB D-/D+ (GPIO19/20) go straight to the USB-C socket: there is no USB-UART bridge and no reset button. Expect a /dev/cu.usbmodem* port (USB-Serial/JTAG). Steps: (1) note the port and confirm the factory demo is running; (2) read chip info with esptool (chip_id, flash_id; expect ESP32-S3R8, 8 MB octal PSRAM, 16 MB W25Q128 flash); (3) read the full 16 MB flash to firmware-backup/factory-<date>.bin with a sha256 alongside, and keep it out of git (gitignore) but somewhere safe; (4) record the procedure and results in docs/BUILD.md. Recovery if a later build wedges USB: hold BOOT (GPIO0) while power-cycling to enter the ROM download mode (Waveshare Firmware-Flashing page). Waveshare's factory image is also in the Firmware directory of github.com/waveshareteam/ESP32-S3-Touch-LCD-1.46, flashed at 0x0, as a second fallback. Needs esptool, which comes with the PlatformIO ESP32 platform (issue 17) or pip.\n\n[2026-10-04] Done on the bench except step 1 (user to confirm the factory demo was running). Port /dev/cu.usbmodem101, Espressif USB JTAG_serial debug unit 303a:1001. esptool flash_id: ESP32-S3 (QFN56) rev v0.2, embedded 8 MB PSRAM, 40 MHz crystal, MAC 28:84:85:56:21:4c, flash manufacturer 0x20 device 0x4018 = XMC 128 Mbit (not the Winbond W25Q128 on the schematic; same size and QIO mode, no build change), 16 MB detected, quad flash in eFuse, 3.3 V. Full 16 MB read to firmware-backup/factory-2026-10-04.bin (gitignored), sha256 34b241754137c0f5cfa522bdac513b1bc7264efff9022f849ba72a2d499ae6eb, verify_flash against the chip: digest matched. Factory partitions: nvs 0x9000, factory app 0x10000 (3 MB), flash_test 0x310000, model (spiffs) 0x394000; app 'ESP32-S3-Touch-LCD-1.46-Test' v1 built Feb 24 2025 on IDF v5.4-dev. Procedure, restore command and results in docs/BUILD.md. Not done: a copy of the backup off this machine (user's call).\n\n[2026-10-04] Closed with the user's go-ahead. The user did not separately confirm the factory demo was on screen before the backup; the image itself is intact (app descriptor parsed, verify_flash matched). Off-machine copy of the backup is left to the user.", "type": "task", "status": "done", "priority": "high", "file": "docs/BUILD.md", "tags": ["firmware", "bringup"], "created": "2026-10-01", "updated": "2026-10-04"}, {"id": 19, "summary": "Board pin map and bring-up notes from the schematic", "description": "Write docs/pins.md and a single include/board_pins.h from docs/datasheets/ESP32-S3-Touch-LCD-1.46-schematic.pdf. No board needed. Extracted from the schematic netlist 2026-10-01 (verify against the GPIO table on page 1 when writing it up):\n- LCD (SPD2010, QSPI, J5): CS IO21, SCK IO40, SDA0 IO46, SDA1 IO45, SDA2 IO42, SDA3 IO41, TE IO18, RESET via expander EXIO2. Backlight BL_PWM IO5 (drives the MP1605 boost via Q3).\n- Touch (SPD2010): I2C SCL IO10 / SDA IO11, INT IO4, RESET via expander EXIO1.\n- Shared I2C bus IO10/IO11: touch, QMI8658 IMU, PCF85063 RTC, TCA9554 expander. IMU INT1/INT2 via EXIO5/EXIO4; RTC INT IO9.\n- TCA9554 expander: EXIO1 TP_RST, EXIO2 LCD_RST, EXIO3 SD_CS, EXIO4 IMU_INT2, EXIO5 IMU_INT1, EXIO6..8 spare (pulled up).\n- microSD (TF-07F): SCLK IO14, MISO/D0 IO16, MOSI/CMD IO17, CS via EXIO3 (SPI mode; D1/D2 pulled up).\n- Audio out PCM5101 + NS8002 amp: BCK IO48, DIN IO47, LRCK IO38. Mic MSM261S4030: WS IO2, SCK IO15, SD IO39.\n- Power: Key_BAT IO6 (PWR key sense), BAT_Control IO7 (power-hold latch via Q1/Q2), BAT_ADC IO8 (divider 200k/100k, so Vbat = 3 x Vadc).\n- BOOT key on GPIO0. USB D-/D+ on IO19/IO20 (native). UART0 TXD/RXD (IO43/44), IO1, IO3, IO12, IO13, 3V3, 5V and BAT on the 2x10 1.27 mm header J9.\n- Flash: external W25Q128 16 MB (QIO). PSRAM: 8 MB octal inside the S3R8.\nBring-up gotchas to record: the display cannot come out of reset until I2C and the TCA9554 are up; on battery the firmware must drive BAT_Control high early or the board turns off when PWR is released; IO45/IO46 are strapping pins used for LCD data.", "type": "docs", "status": "open", "priority": "high", "file": "docs/pins.md", "tags": ["firmware", "docs"], "created": "2026-10-01", "updated": "2026-10-01"}, {"id": 20, "summary": "Firmware skeleton: pinned PlatformIO env, USB serial hello, docs/BUILD.md", "description": "Smallest firmware that proves the build-flash-monitor loop. platformio.ini env for ESP32-S3 with 16 MB flash (QIO), octal PSRAM enabled, USB CDC on boot (native USB, issue 18), a 16 MB partition table, and versions pinned per issue 17. src/main.cpp prints chip model, flash size, PSRAM size and free heap over USB serial once a second. docs/BUILD.md in the pizero project's style: envs, build, upload, monitor, the BOOT-while-power-cycling recovery, and where the factory backup lives. Done when the user has flashed it, seen the serial output, and the board survives a power cycle.\n\n[2026-10-04] platformio.ini came from issue 17. src/main.cpp prints a banner (chip model/rev/cores/MHz, flash size and speed, PSRAM size and found) at start and every 10 s, plus uptime, free heap and free PSRAM once a second. First write to the board (factory backup from issue 18 taken first); upload over /dev/cu.usbmodem101 auto-reset with no buttons, about 13 s. Serial read back: ESP32-S3 rev 2, 2 cores @ 240 MHz, flash 16777216 @ 80 MHz, PSRAM 8388608 found, heap free 350632, PSRAM free 8385672, steady. docs/BUILD.md written (toolchain, commands, USB recovery, backup/restore, first output). Remaining for done: the user sees the output with 'pio device monitor' and the board comes back after a power cycle (unplug/replug USB).\n\n[2026-10-04] Closed: the user saw the serial output after unplugging and replugging USB (\"that looks good\"). Build, flash, monitor and power-cycle survival all confirmed on the board. Also noted in docs/BUILD.md: pio device monitor needs a real TTY and fails under Claude Code's ! prefix; a non-interactive pyserial read is given instead. Not tested: the BOOT-while-power-cycling recovery path (not needed yet) and running on battery (issue 25).", "type": "feature", "status": "done", "priority": "high", "file": "platformio.ini", "tags": ["firmware", "toolchain"], "created": "2026-10-01", "updated": "2026-10-04"}, {"id": 21, "summary": "Shared I2C bus and TCA9554 expander driver", "description": "Gate for the display and touch, whose reset lines are on the expander (issue 19). Bring up I2C on IO10/IO11, scan and print every address found, and drive the TCA9554: configure EXIO1 (TP_RST) and EXIO2 (LCD_RST) as outputs and pulse them. Expected devices: TCA9554 (0x20 range, set by A0..A2 straps), QMI8658, PCF85063 (0x51), SPD2010 touch; record the actual addresses found in docs/pins.md rather than trusting typical values (pizero lesson).", "type": "feature", "status": "open", "priority": "high", "file": "src/", "tags": ["firmware", "bringup"], "created": "2026-10-01", "updated": "2026-10-01"}, {"id": 22, "summary": "Display: SPD2010 over QSPI with backlight", "description": "Biggest unknown in the bring-up. Drive the 412x412 SPD2010 panel over QSPI (pins in issue 19) through esp_lcd, using Waveshare's esp_lcd_spd2010 driver from their example repo as reference, with LCD reset via the expander (issue 21) and backlight PWM on IO5. Milestones: solid red/green/blue fills, a test pattern showing the round visible area and orientation (which way is 12 o'clock relative to the crown on the case), then a measured full-screen refresh rate. Record the init sequence source and any changes.", "type": "feature", "status": "open", "priority": "high", "file": "src/", "tags": ["firmware", "display"], "created": "2026-10-01", "updated": "2026-10-01"}, {"id": 23, "summary": "Touch: SPD2010 touch over I2C", "description": "Read touch points from the SPD2010 touch controller on the shared I2C bus with the interrupt on IO4 and reset on EXIO1. Print raw coordinates, confirm they map to display coordinates (rotation and mirroring match issue 22), and check behaviour at the round edge. Waveshare's example has a reference driver.", "type": "feature", "status": "open", "priority": "medium", "file": "src/", "tags": ["firmware", "touch"], "created": "2026-10-01", "updated": "2026-10-01"}, {"id": 24, "summary": "LVGL integration", "description": "LVGL 8.3.10 (Waveshare's tested version; their driver code depends on it, issue 17) with draw buffers in PSRAM, flush through the esp_lcd panel from issue 22 and an input driver from issue 23. Done when a simple round-screen UI responds to touch with smooth updates; record buffer sizes and frame rate. Moving to LVGL 9 is a later, separate decision.", "type": "feature", "status": "open", "priority": "medium", "file": "src/", "tags": ["firmware", "lvgl"], "created": "2026-10-01", "updated": "2026-10-01"}, {"id": 25, "summary": "Power: hold latch, PWR key, battery voltage", "description": "Needed before the board can run from a battery in the pocket-watch case. Drive BAT_Control (IO7) high early in boot so the board stays on after PWR is released; read Key_BAT (IO6) for the PWR key (short press vs long-press power off); read BAT_ADC (IO8) and scale by 3 (200k/100k divider) with ADC calibration. Check what the ETA6098 charger exposes (STAT pin routing) and whether charge state can be read. Test on USB and on a cell.", "type": "feature", "status": "open", "priority": "medium", "file": "src/", "tags": ["firmware", "power"], "created": "2026-10-01", "updated": "2026-10-01"}, {"id": 26, "summary": "Sensors: QMI8658 IMU and PCF85063 RTC", "description": "Read accelerometer/gyro from the QMI8658 (interrupts via expander EXIO4/EXIO5) and keep time with the PCF85063 (INT IO9). The IMU can drive screen orientation or wrist/raise-to-wake later; the RTC keeps time across power cycles.", "type": "feature", "status": "open", "priority": "low", "file": "src/", "tags": ["firmware", "sensors"], "created": "2026-10-01", "updated": "2026-10-01"}, {"id": 27, "summary": "microSD and audio", "description": "microSD over SPI (SCLK IO14, MISO IO16, MOSI IO17, CS via EXIO3), FAT32. Audio out through the PCM5101 DAC on I2S (BCK IO48, DIN IO47, LRCK IO38) into the NS8002 amp and the onboard speaker; mic input from the MSM261S4030 (I2S, IO2/IO15/IO39). The microSD slot is reachable through back cup v1.1.", "type": "feature", "status": "open", "priority": "low", "file": "src/", "tags": ["firmware", "storage", "audio"], "created": "2026-10-01", "updated": "2026-10-01"}, {"id": 28, "summary": "Wi-Fi bring-up and network time", "description": "Connect to Wi-Fi with credentials kept out of git, sync time by NTP and write it to the RTC (issue 26). Basis for anything networked later (OTA updates, data feeds).", "type": "feature", "status": "open", "priority": "low", "file": "src/", "tags": ["firmware", "network"], "created": "2026-10-01", "updated": "2026-10-01"}, {"id": 29, "summary": "Back cup polish: edge finish and tighten the bottom notch", "description": "Filed from issue 15 when it closed. v1.1 prints and fits but is rough around the edges. The bottom notch is sized to the STEP model's FPC tab (cup_notch_hw 10.6, notch down to z -7.85); the user's photo suggests the real tab is nearer 14 wide. Measure the tab width and reach, tighten the notch, and look at chamfers/edge quality on the rim and flank.", "type": "feature", "status": "open", "priority": "low", "file": "pocketwatch/pocketwatch.scad", "tags": ["pocketwatch", "cosmetic"], "created": "2026-10-01", "updated": "2026-10-01"}], "roadmap": [{"rank": 1, "id": 19, "why": "No board needed and everything else reads from it; it also surfaces the two bring-up traps (resets behind the I2C expander, the battery power latch) before any code is written.", "added": "2026-10-01"}, {"rank": 2, "id": 21, "why": "The display and touch resets sit on the expander, so this gates both.", "added": "2026-10-01"}, {"rank": 3, "id": 22, "why": "Retires the biggest unknown (SPD2010 QSPI init); everything visible depends on it.", "added": "2026-10-01"}, {"rank": 4, "id": 23, "why": "Second half of the screen; needed before LVGL input.", "added": "2026-10-01"}, {"rank": 5, "id": 24, "why": "First usable UI layer, built on 22 and 23.", "added": "2026-10-01"}]}</script>
<script>
(function () {
  var STATUS_ORDER = ['open', 'in-progress', 'done', 'deferred', 'wontfix'];
  var PRIORITY_ORDER = ['high', 'medium', 'low'];
  var TAG_PILL_LIMIT = 20;   // the rest hide behind a "+N more" toggle
  // Themes are the coarse grouping: one per issue, from a fixed vocabulary,
  // unlike the free-form tags. Order is the order they are worked in.
  var THEME_ORDER = ['trust', 'kit', 'input', 'experience', 'platform', 'storage', 'devices'];
  var LIVE = ['open', 'in-progress'];
  var KEY = 'issues-view:' + location.pathname;
  // Longest alternative first: "jsonl" must win over "json".
  var PATH_RE = /\b((?:[\w.-]+\/)*[\w.-]+\.(?:jsonl|json|md|html|css|js|ts|tsx|jsx|py|rb|go|rs|java|c|h|cpp|sh|toml|ya?ml|cfg|ini|txt|bas|dsk|png))(:\d+(?:-\d+)?)?/g;

  var issues = [];
  var active = { status: [], type: [], tag: [], theme: [] };
  var q = document.getElementById('q');
  var list = document.getElementById('list');
  var count = document.getElementById('count');
  var empty = document.getElementById('empty');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function rank(v, order) {
    var i = order.indexOf(v);
    return i === -1 ? order.length : i;
  }

  function markup(text) {
    return String(text).split('\n\n').map(function (para) {
      return '<p>' + esc(para).replace(PATH_RE, '<code>$&</code>').replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }

  function summaryOf(i) { return i.summary || i.title || '(untitled)'; }
  function tagsOf(i) { return i.tags || i.labels || []; }

  function card(i) {
    var status = i.status || '?', priority = i.priority || '?', type = i.type || '?';
    var el = document.createElement('article');
    el.className = 'card';
    el.id = 'i' + i.id;
    el.dataset.status = status;
    el.dataset.type = type;
    el.dataset.tags = tagsOf(i).join(' ');
    el.dataset.theme = i.theme || '';
    el.innerHTML =
      '<header><button class="row" aria-expanded="false">' +
      '<span class="id">#' + esc(i.id) + '</span>' +
      '<span class="summary">' + esc(summaryOf(i)) + '</span>' +
      '<span class="chips">' +
        '<span class="chip st-' + esc(status) + '">' + esc(status) + '</span>' +
        '<span class="chip pr-' + esc(priority) + '">' + esc(priority) + '</span>' +
        '<span class="chip ty">' + esc(type) + '</span>' +
        (i.theme ? '<span class="chip th">' + esc(i.theme) + '</span>' : '') +
      '</span><span class="caret" aria-hidden="true"></span></button></header>' +
      '<div class="body" hidden><div class="desc">' +
      markup(i.description || '(no description)') + '</div><footer>' +
      tagsOf(i).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') +
      '<span class="meta"><code>' + esc(i.file || '-') + '</code> &middot; created ' +
      esc(i.created || '?') + ' &middot; updated ' + esc(i.updated || '?') +
      '</span></footer></div>';
    el.querySelector('.row').addEventListener('click', function () {
      setOpen(el, el.querySelector('.body').hidden);
    });
    return el;
  }

  function setOpen(el, open) {
    el.querySelector('.row').setAttribute('aria-expanded', open);
    el.querySelector('.body').hidden = !open;
  }

  // The roadmap stores only rank, id and why. Everything shown here is joined
  // from the tracker, so an entry pointing at a missing or finished issue is
  // visibly wrong rather than quietly stale.
  function drawRoadmap(plan, byId) {
    if (!plan.length) return;
    var host = document.getElementById('plan');
    plan.slice().sort(function (a, b) { return (a.rank || 0) - (b.rank || 0); })
      .forEach(function (e) {
        var issue = byId[e.id];
        var li = document.createElement('li');
        li.className = 'step';
        var head, warn = '';
        if (!issue) {
          head = '#' + esc(e.id) + ' is not in the tracker';
          warn = 'no such issue';
          li.className += ' bad';
        } else {
          head = '<a href="#i' + esc(e.id) + '">#' + esc(e.id) + ' ' +
                 esc(summaryOf(issue)) + '</a> <span class="chip st-' +
                 esc(issue.status) + '">' + esc(issue.status) + '</span>';
          if (LIVE.indexOf(issue.status) === -1) {
            warn = 'already ' + issue.status + ', take it off the roadmap';
            li.className += ' bad';
          }
        }
        li.innerHTML = '<span class="rank">' + esc(e.rank || '?') + '.</span>' +
          '<span class="what">' + head +
          '<span class="why">' + esc(e.why || '') + '</span>' +
          (warn ? '<span class="warn">' + esc(warn) + '</span>' : '') + '</span>';
        var link = li.querySelector('a');
        if (link) {
          link.addEventListener('click', function () {
            var target = document.getElementById('i' + e.id);
            if (target) { target.hidden = false; setOpen(target, true); }
          });
        }
        host.appendChild(li);
      });
    document.getElementById('roadmap').hidden = false;
  }

  function pills(host, filter, values, counts, limit) {
    var hidden = (limit && values.length > limit) ? values.length - limit : 0;
    document.getElementById(host).innerHTML = values.map(function (v, idx) {
      var extra = hidden && idx >= limit;
      return '<button class="pill' + (extra ? ' extra' : '') + '"' +
        (extra ? ' hidden' : '') +
        ' data-filter="' + filter + '" data-value="' + esc(v) + '">' +
        esc(v) + (counts ? ' <span class="n">' + counts[v] + '</span>' : '') + '</button>';
    }).join('') + (hidden
      ? '<button class="morebtn" data-host="' + host + '">+' + hidden + ' more</button>'
      : '');
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ active: active, q: q.value }));
    } catch (e) {}
  }

  function apply() {
    var needle = q.value.trim().toLowerCase();
    var shown = 0;
    [].forEach.call(list.children, function (el) {
      var ok =
        (!active.status.length || active.status.indexOf(el.dataset.status) !== -1) &&
        (!active.type.length || active.type.indexOf(el.dataset.type) !== -1) &&
        (!active.theme.length || active.theme.indexOf(el.dataset.theme) !== -1) &&
        (!active.tag.length || active.tag.some(function (t) {
          return el.dataset.tags.split(' ').indexOf(t) !== -1;
        })) &&
        (!needle || el.textContent.toLowerCase().indexOf(needle) !== -1);
      el.hidden = !ok;
      if (ok) shown++;
    });
    empty.hidden = shown !== 0;
    count.textContent = shown + ' of ' + issues.length + ' shown';
    [].forEach.call(document.querySelectorAll('.pill'), function (p) {
      p.setAttribute('aria-pressed', active[p.dataset.filter].indexOf(p.dataset.value) !== -1);
    });
    save();
  }

  function draw(data, plan, note) {
    issues = data.slice().sort(function (a, b) {
      return rank(a.status, STATUS_ORDER) - rank(b.status, STATUS_ORDER) ||
             rank(a.priority, PRIORITY_ORDER) - rank(b.priority, PRIORITY_ORDER) ||
             (a.id || 0) - (b.id || 0);
    });

    var counts = {}, byId = {};
    STATUS_ORDER.forEach(function (s) { counts[s] = 0; });
    issues.forEach(function (i) {
      counts[i.status] = (counts[i.status] || 0) + 1;
      byId[i.id] = i;
    });

    list.innerHTML = '';
    issues.forEach(function (i) { list.appendChild(card(i)); });
    drawRoadmap(plan || [], byId);

    pills('f-status', 'status', STATUS_ORDER.filter(function (s) { return counts[s]; }), counts);
    pills('f-type', 'type', unique(issues.map(function (i) { return i.type || '?'; })));

    var themeCounts = {};
    issues.forEach(function (i) {
      if (i.theme) themeCounts[i.theme] = (themeCounts[i.theme] || 0) + 1;
    });
    var themes = THEME_ORDER.filter(function (t) { return themeCounts[t]; })
      .concat(Object.keys(themeCounts).filter(function (t) {
        return THEME_ORDER.indexOf(t) === -1;
      }).sort());
    document.getElementById('f-theme').parentNode.hidden = !themes.length;
    pills('f-theme', 'theme', themes, themeCounts);
    // A project can accumulate hundreds of tags, most of them used once.
    // Showing every one buries the results, so lead with the most used and
    // keep the long tail behind a toggle.
    var tagCounts = {};
    issues.forEach(function (i) {
      tagsOf(i).forEach(function (t) { tagCounts[t] = (tagCounts[t] || 0) + 1; });
    });
    var tagNames = Object.keys(tagCounts).sort(function (a, b) {
      return tagCounts[b] - tagCounts[a] || (a < b ? -1 : a > b ? 1 : 0);
    });
    pills('f-tag', 'tag', tagNames, tagCounts, TAG_PILL_LIMIT);

    [].forEach.call(document.querySelectorAll('.pill'), function (p) {
      p.addEventListener('click', function () {
        var l = active[p.dataset.filter], i = l.indexOf(p.dataset.value);
        if (i === -1) l.push(p.dataset.value); else l.splice(i, 1);
        apply();
      });
    });

    [].forEach.call(document.querySelectorAll('.morebtn'), function (b) {
      b.addEventListener('click', function () {
        var host = document.getElementById(b.dataset.host);
        var extras = host.querySelectorAll('.pill.extra');
        var show = extras.length && extras[0].hidden;
        [].forEach.call(extras, function (p) { p.hidden = !show; });
        b.textContent = show ? 'fewer' : '+' + extras.length + ' more';
      });
    });

    var open = (counts.open || 0) + (counts['in-progress'] || 0);
    document.getElementById('lede').innerHTML =
      issues.length + ' issues, ' + open + ' of them still open' +
      ((plan && plan.length) ? ', ' + plan.length + ' on the roadmap' : '') +
      '. Read from <code>issues.jsonl</code>.';
    if (note) {
      var n = document.getElementById('note');
      n.textContent = note;
      n.hidden = false;
    }

    try {
      var s = JSON.parse(localStorage.getItem(KEY) || '{}');
      if (s.active) active = s.active;
      if (s.q) q.value = s.q;
    } catch (e) {}

    apply();

    if (location.hash) {
      var target = document.querySelector(location.hash);
      if (target && target.classList.contains('card')) {
        target.hidden = false;
        setOpen(target, true);
        target.scrollIntoView();
      }
    }
  }

  function unique(a) {
    return a.filter(function (v, i) { return a.indexOf(v) === i; }).sort();
  }

  q.addEventListener('input', apply);
  document.getElementById('reset').addEventListener('click', function () {
    active = { status: [], type: [], tag: [], theme: [] };
    q.value = '';
    apply();
  });
  document.getElementById('expand').addEventListener('click', function () {
    [].forEach.call(list.children, function (c) { if (!c.hidden) setOpen(c, true); });
  });
  document.getElementById('collapse').addEventListener('click', function () {
    [].forEach.call(list.children, function (c) { setOpen(c, false); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; apply(); }
  });

  function lines(text) {
    return text.split('\n').filter(function (l) { return l.trim(); }).map(JSON.parse);
  }

  function grab(name) {
    return fetch(name, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(lines);
  }

  // The live files first. Browsers refuse a file:// fetch, so fall back to the
  // snapshot baked in at build time and say which one is on screen. A missing
  // roadmap.jsonl is not an error: the section just stays hidden.
  grab('issues.jsonl')
    .then(function (data) {
      grab('roadmap.jsonl')
        .catch(function () { return []; })
        .then(function (plan) { draw(data, plan); });
    })
    .catch(function () {
      var snap = JSON.parse(document.getElementById('snapshot').textContent);
      draw(snap.issues, snap.roadmap,
        'Showing the snapshot saved when this page was last built, because the browser would ' +
        'not read the .jsonl files from disk. To see them live, serve the directory ' +
        '(python3 -m http.server) and open it over http, or rebuild this page.');
    });
})();
</script>
</body>
</html>
