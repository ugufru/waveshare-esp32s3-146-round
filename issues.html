<script id="snapshot" type="application/json">{"issues": [{"id": 1, "summary": "Record board specs and check the case against them", "description": "Collected the Waveshare ESP32-S3-Touch-LCD-1.46 specs, schematic and structural drawings (docs/datasheets/) and measured Case_Top.stl and Case_back.stl by slicing them in Python (no CAD tool available). Results and a fit table are in docs/board-specs.md. STEP models were downloaded but not committed (about 15 MB each); their URLs are in the doc. Findings were filed as issues 2 to 11. Left open only for the user to review the doc.\n\n[2026-10-07] Closed: the user reviewed it and agreed it is closable. Delivered docs/board-specs.md and the fit check; its findings became issues 2 to 11. Not done: nothing outstanding here (the STEP models stay uncommitted by design, URLs in the doc).", "type": "docs", "status": "done", "priority": "medium", "file": "docs/board-specs.md", "tags": ["docs", "fit-check"], "created": "2026-09-28", "updated": "2026-10-07"}, {"id": 2, "summary": "Correct the README: board is a 1.46in IPS LCD, not a 1.43in AMOLED, and the case fits the cover-glass SKU only", "description": "hardware/README.txt (copied from Thingiverse thing 7386073) describes the board as a '1.43-inch 412x412 Round AMOLED'. That is the ESP32-S3-Touch-AMOLED-1.43. The ESP32-S3-Touch-LCD-1.46 is a 1.46in IPS LCD with an SPD2010 driver. Also state which SKU fits: the front aperture is 41.6 dia (Case_Top.stl, z 0 to 1). The cover-glass 1.46 (SKU 29565) has a 44.77 lens and seats on the ledge. The glassless 1.46B (SKU 29564) is 39.36 across and would fall straight through. Either document 'fits 29565 only' or add a 1.46B variant (see issue 11). Keep the original Thingiverse text and attribution (CC BY-SA).\n\n[2026-10-08] Priority lowered to low (tidy-up with the user): hardware/ holds the imported Thingiverse case, which the pocket-watch back cup replaced. The README there is still wrong and the fix is still worth a few lines, but nothing depends on it.\n\n[2026-10-11] Fixed: hardware/README.txt now opens with a corrections note (1.46in IPS LCD with SPD2010, not a 1.43in AMOLED; fits SKU 29565 only, 1.46B falls through); the Thingiverse text and attribution are kept unchanged below it. Also corrected pocketwatch/README.md: v1.2 is printed and fits (was 'not yet printed'), v1.1 is no longer 'current', v1.1 is engraved 'v1.1' (was 'v1.0'), the older sections are marked superseded with the M2 standoff claim flagged (issue 36), and the v1 'not checked on a real print' line now says the print did not fit. Awaiting user review.", "type": "docs", "status": "open", "priority": "low", "file": "hardware/README.txt", "tags": ["docs", "compatibility"], "created": "2026-09-28", "updated": "2026-10-11"}, {"id": 3, "summary": "New pocket-watch case from the ground up (parametric OpenSCAD)", "description": "Scope changed from 'reproduce the Thingiverse STLs' to a new design. Phase 1: a proper enclosure for the cover-glass 1.46 (SKU 29565) plus a 20 x 30 mm LiPo, round and pocket-watch styled, with a bow at 12 o'clock for a chain, closed with the M2.5 x 12 countersunk self-tapping screws from the xroar-waveshare-rp2350-pizero case.\n\nBuilt as pocketwatch/pocketwatch.scad (front.stl, back.stl, README.md). Coordinates are the Waveshare STEP model's, and board positions were measured from that model rather than the drawing. Key decisions: the board's standoffs are M2 female, so the M2.5 screws go into bosses in the case band, and posts on the caseback land on the standoff tips (pins in the bores, 0.1 mm preload) to clamp the glass against a 1.2 mm bezel lip. The display's FPC tab at 6 o'clock sits in a notch, which keys rotation so USB-C always lines up with its port. The USB-C plug pocket runs through the band to the receptacle face so plugs seat fully. The cell sits behind the 2x10 header in a cradle on the caseback. PWR is reached by a pinhole with a guide tube. Screw seat and 2.2 pilot carry over the lessons from the pizero case. The screw pattern is not 120 degree symmetric, so the back fits one way only.\n\nVerified: both parts render manifold; tools/fitcheck.py against the STEP mesh shows no contact except the intended preload at the standoff tips. Not verified: any real print. Open questions: the cell's actual size (5.0 thick assumed), standoff bore size, USB-C plug overmould fit. Follow-ups filed as issues 12 to 14. Issues 4, 5, 7 and 9 describe defects of the Thingiverse case that this design addresses by construction; close them once a print is confirmed.\n\n[2026-10-07] Closed with the user's agreement. The v1 design work is delivered: pocketwatch/pocketwatch.scad with the board geometry from the STEP model, fit-check tooling, and the v1 print (issue 12). v1's front did not take the module; the design continued as the back cup (issue 15, done and fitting) and the front refit (issue 16, open), which carries the remaining open questions (real module outline, battery room, PWR/BOOT pushers). Issues 4, 5, 7 and 9 were already closed as wontfix since they describe the replaced Thingiverse case.", "type": "feature", "status": "done", "priority": "high", "file": "pocketwatch/pocketwatch.scad", "tags": ["cad", "source"], "created": "2026-09-28", "updated": "2026-10-07"}, {"id": 4, "summary": "Retain the board: it floats 1.0 mm radially and about 3 mm axially, and nothing uses the M2 standoffs", "description": "Bore is 46.8 dia against a 44.77 lens, so 1.0 mm radial play. Cavity is 14.0 deep (front plate top at z 1.0 to rim at z 15.0) against a 10.9 module, so about 3.1 mm axial play; the lid does not touch the board. The board is held by nothing and can rattle and rotate. The board has 3 x M2 brass standoffs, 3.5 high, at (0, +17.75), (-12.00, -14.95), (+11.54, -15.45) from display centre (docs/datasheets/*dimensions*.pdf). Options: posts on the lid that land on the standoffs with M2 x 4 screws through the lid; or lid posts that clamp the PCB against the ledge with a thin foam ring on the lens. Also tighten the bore to about 45.1 to 45.2, and fix rotation so USB-C always lines up with the window (currently the port face at r 23.0 is inside the r 23.4 bore and cannot key anything). Standoff-based location solves rotation too.\n\n[2026-10-01] Not pursued: this describes the Thingiverse case in hardware/, which was replaced by the pocket-watch design (issues 3, 15, 16). Kept for reference.", "type": "bug", "status": "wontfix", "priority": "high", "file": "hardware/files/Case_Top.stl", "tags": ["fit", "retention"], "created": "2026-09-28", "updated": "2026-10-01"}, {"id": 5, "summary": "Retain the lid: it rests on the rim and is held only by peg friction", "description": "Case_back.stl is a 52.0 x 1.8 disc with three edge notches that drop over 2.5 dia x 2.0 pegs on the rim (at 6.5, 131.5 and -118.8 deg, so orientation is keyed, which is good). Nothing holds it down, so the lid falls off if the case is tipped or picked up face-down. If issue 4 goes with screws through the lid into the standoffs, that also fixes this; otherwise use a twist-lock bayonet, snap tabs, or a press-fit lip into the 46.8 bore.\n\n[2026-10-01] Not pursued: this describes the Thingiverse case in hardware/, which was replaced by the pocket-watch design (issues 3, 15, 16). Kept for reference.", "type": "bug", "status": "wontfix", "priority": "medium", "file": "hardware/files/Case_back.stl", "tags": ["fit", "retention"], "created": "2026-09-28", "updated": "2026-10-01"}, {"id": 6, "summary": "Back cup: measure board temperature and add vents if needed", "description": "README says 'Passive thermal ventilation slots'. Slicing both STLs shows no openings other than the USB window (12.0 x 7.0 on the -X side). The lid is solid. An ESP32-S3 on Wi-Fi continuously plus an LCD backlight in a sealed PLA puck will run warm, and PLA softens around 55 to 60 C. Add slots in the lid (they can double as a speaker grille, issue 8) and ideally a low intake near the front so air can move. Measure the board temperature in the closed case before and after.\n\n[2026-10-08] Rewritten (tidy-up with the user): the Thingiverse case this described was replaced. The concern carries over to back cup v1.2: the board runs Wi-Fi (modem sleep currently off, issue 35) and the backlight inside a closed PLA cup with the glass on top. Measure first: read the QMI8658 temperature (src/imu.cpp) or touch-test the cup after an hour on Wi-Fi at full brightness; add slots in the floor or flank only if it runs warm. PLA softens around 55 to 60 C.", "type": "task", "status": "open", "priority": "low", "file": "pocketwatch/pocketwatch.scad", "tags": ["pocketwatch", "thermal"], "created": "2026-09-28", "updated": "2026-10-08"}, {"id": 7, "summary": "Check the USB-C window against real cable overmolds", "description": "The port face sits about 0.4 mm inside the bore plus the 2.6 wall, so the receptacle is about 3.0 mm behind the outer skin. The window is 12.0 wide x 7.0 tall, spanning z 5.6 to 12.6 from the front face. Whether a plug seats fully depends on where the receptacle's centre lands in z (not dimensioned on the Waveshare drawing; take it from the STEP) and on overmold size (commonly up to about 12 x 7). If the window is off-centre or too small, thin the wall locally to 1.2 mm around the port or enlarge the window. Test with a few cables including a chunky one. Also note there are small inward guide features around the window (z 7 to 11.9, near r 21.5); confirm they do not foul the PCB.\n\n[2026-10-01] Not pursued: this describes the Thingiverse case in hardware/, which was replaced by the pocket-watch design (issues 3, 15, 16). Kept for reference.", "type": "task", "status": "wontfix", "priority": "medium", "file": "hardware/files/Case_Top.stl", "tags": ["fit", "usb"], "created": "2026-09-28", "updated": "2026-10-01"}, {"id": 8, "summary": "Back cup: openings for the speaker and mic", "description": "All of these are on the back of the PCB and are covered by the solid lid. PWR matters when running on battery; BOOT is needed for recovery flashing; the speaker and mic are muffled by a sealed lid about 3 mm away. Add small button plungers or pin holes over PWR and BOOT, a grille over the speaker and a hole over the mic. Positions come from the STEP or the dimension drawing.\n\n[2026-10-08] Trimmed (tidy-up with the user): PWR and BOOT pin holes and the microSD slot are delivered in back cup v1.1 and v1.2 (pocketwatch/pocketwatch.scad, btn_angles and sd_*). Still open: a grille over the onboard speaker and a hole over the mic, so audio is not muffled once issue 27 brings audio up. Positions from the STEP mesh (speaker about x 3.9..18.5, y -5..5 per issue 14); the cup floor sits behind them.", "type": "feature", "status": "open", "priority": "low", "file": "pocketwatch/pocketwatch.scad", "tags": ["pocketwatch", "access", "audio"], "created": "2026-09-28", "updated": "2026-10-08"}, {"id": 9, "summary": "Optional deeper back with room for a LiPo", "description": "The board has an MX1.25 2-pin 3.7 V LiPo connector and an onboard charger, but there is only about 3 mm spare depth behind the module and the 2x9 header takes the centre-right. A spacer ring or deeper lid variant (about 5 to 6 mm) would take a small cell such as a 502030. Depends on issue 3 and on the retention design in issue 4.\n\n[2026-10-01] Not pursued: this describes the Thingiverse case in hardware/, which was replaced by the pocket-watch design (issues 3, 15, 16). Kept for reference.", "type": "feature", "status": "wontfix", "priority": "low", "file": "hardware/files/Case_back.stl", "tags": ["battery"], "created": "2026-09-28", "updated": "2026-10-01"}, {"id": 10, "summary": "Add a desk stand or tilted foot", "description": "It is sold as a desktop radar/flight tracker, but the case is a flat 52 x 17 puck: it either lies face-up or rolls on its edge. Add a separate cradle or a flat-bottomed tilt foot (15 to 25 deg back) that routes the USB-C cable out the back. A separate part keeps the main case unchanged.\n\n[2026-10-08] Still applies to the back cup (tidy-up with the user): the pocket-watch cup is round-backed with a 38.1 flat base, so a separate cradle or tilted foot that clears the 6 o'clock lug and leaves USB-C reachable would suit a desk. File reference moved to the pocket-watch source.", "type": "feature", "status": "open", "priority": "low", "file": "pocketwatch/pocketwatch.scad", "tags": ["desktop"], "created": "2026-09-28", "updated": "2026-10-08"}, {"id": 11, "summary": "Cosmetic front: chamfer the aperture and consider a 1.46B variant", "description": "The 41.6 aperture has a square 1.0 mm edge, about 2 mm outside the 37.56 viewable area. A 45 deg chamfer on the outer edge reduces shadowing at viewing angles and looks less printed. Separately, a 1.46B (no cover glass, 39.36 x 41.53 including the bottom tab, 9.0 thick) variant needs a smaller aperture (about 38) and a different ledge; worth doing only once issue 3 exists.\n\n[2026-10-08] Not pursued (tidy-up with the user): the case no longer has a front part. Since issue 16 the board's cover glass is the top surface and the case is the back cup only, so there is no aperture to chamfer. A 1.46B (glassless) variant would need its own design and is not planned.", "type": "feature", "status": "wontfix", "priority": "low", "file": "hardware/files/Case_Top.stl", "tags": ["cosmetic", "compatibility"], "created": "2026-09-28", "updated": "2026-10-08"}, {"id": 12, "summary": "Pocket-watch case: print, assemble and measure phase 1", "description": "Print front.stl and back.stl (PW-F v1, PW-B v1 engraved inside) and check: glass seats with no rattle and no crushing (0.1 mm post preload, pocketwatch.scad post_preload); pins find the M2 standoff bores (pin_d 1.4, standoff_bore_d is [?]); the cell fits the cradle (bat_t 5.0 assumed; for a 402030 set bat_t = 4.0 and the case gets 1 mm thinner); a USB-C cable seats fully; PWR responds through the pinhole; the three screw bosses take the M2.5 x 12 screws without splitting. Record measured values in the source as [M].\n\n[2026-09-28 first print] PW-F v1 / PW-B v1 printed. The module did not fit the front. The user's photo of the board back shows the outline is not fully round near USB-C (the display FPC tab and the area around the port). What exactly fouled was not recorded. Work restarted from the back: see issue 15 (backplate) and issue 16 (front refit).\n\n[2026-10-01] Closed: the v1 print happened and its result is recorded above (module did not fit PW-F v1). The work moved to issue 15 (back cup, done) and issue 16 (front refit).", "type": "task", "status": "done", "priority": "high", "file": "pocketwatch/pocketwatch.scad", "tags": ["pocketwatch", "fit"], "created": "2026-09-28", "updated": "2026-10-01"}, {"id": 13, "summary": "Pocket-watch case: crown and bow sit at the front face, not mid-depth", "description": "Phase 1 prints the crown and bow flat on the bed with the front face so the bow's layers run in the plane of the ring and a chain pulls along them. That puts them at z +1.2 to -2.8 on a 22.35 mm deep case, so from the side they sit forward of centre. A mid-depth bow would need supports or a separate part (for example a metal bow through a pendant hole). Decide after handling the phase 1 print.\n\n[2026-10-08] Not pursued (tidy-up with the user): the crown and bow belonged to the v1 front, which was dropped in issue 16 (back cup only, glass on top). A bow or chain fixing on the back cup would be a new issue if wanted.", "type": "feature", "status": "wontfix", "priority": "low", "file": "pocketwatch/pocketwatch.scad", "tags": ["pocketwatch", "style"], "created": "2026-09-28", "updated": "2026-10-08"}, {"id": 14, "summary": "Pocket-watch case: BOOT button and speaker are blocked by the cell", "description": "BOOT (TS24CA at x 14.7, y -10.2 in STEP coordinates) and the 12 x 10 speaker (x 3.9..18.5, y -5..5) are behind the cell footprint, so neither gets a hole in phase 1. BOOT is only needed for recovery flashing (remove the back). If audio matters, the cell has to move or a smaller cell used, and the caseback needs a grille. There are also no vents; check temperature on the phase 1 print (issue 6).\n\n[2026-10-08] Not pursued (tidy-up with the user): this described the phase-1 caseback with a cradle for the cell, which was replaced by the back cup (issues 15, 16). Back cup v1.2 has no room for a cell at all; where the LiPo goes in the case is not covered by any issue yet.", "type": "feature", "status": "wontfix", "priority": "low", "file": "pocketwatch/pocketwatch.scad", "tags": ["pocketwatch", "access", "audio"], "created": "2026-09-28", "updated": "2026-10-08"}, {"id": 15, "summary": "Backplate that the board screws to through its three M2 standoffs", "description": "New part PW-P v1 in pocketwatch/pocketwatch.scad (part=\"plate\", plate.stl). Replaces the v1 idea of posts clamping the board; the board is now fixed to the plate. 54.0 OD x 2.4 plate with three 5.4 dia seats, 2.59 tall, under the standoffs at (12.00,-14.95), (-11.54,-15.45), (0,17.75) [STEP coords, looking at the display]. Seat height is derived so the plate's inner face clears the 2x10 header tips (z -12.95) by 0.55; nothing else on the board is deeper. M2 countersunk holes (3.8 head, 90 degree seat sunk 0.5) through plate and seats. The standoffs are M2 female, so the M2.5 x 12 screws from the pizero case cannot be used here: M2 x 8 countersunk engages 3.01 of the 3.51 standoff (m2_len; asserted to stay between 1.5 and the PCB). The three M2.5 holes on the v1 screw circle are kept so the next front can close onto this plate. Fit check against the STEP mesh: contact only at the seat faces. Not yet printed. PWR and BOOT turned out to be side-actuated switches at the board edge (visible in the photo), so the v1 PWR pinhole in the back was wrong; access belongs in the band, handled with issue 16.\n\n[2026-09-28] The user's M2 screws do not go into the standoffs, so the Waveshare drawing's M2 callout does not match this board; the real thread is unknown (M1.6 suspected, unmeasured). Added a screwless variant PW-PP v1 (part=\"plate_pins\", plate_pins.stl): same plate and seats, no screw holes, a 1.0 dia x 2.0 pin with a 0.3 lead-in on each seat that drops into the standoff bore whatever the thread. Pins locate only; the board is held once the front closes onto the plate with the M2.5 screws. Fit check: contact only at the seat faces, pins clear. The screw variant (plate.stl) is unchanged and needs its m2_* parameters set once the thread is measured. Measure the standoff bore (inside jaws) to settle it.\n\n[2026-09-28] PW-PP confirmed: the pins line the board up. Grown into back cup v1.0 (part=\"back_cup\", back_cup.stl; \"v1.0\" engraved on the inside floor). Flat base 38.1 (1.5 in), 2 mm wall rising on a 45 degree flank with a 3 mm round into a 46.8 band, rim 0.2 below the glass back (z -1.8; inside floor to rim 11.7, height 14.1). Band 46.8 rather than glass-flush because the lower-left standoff reaches r 21.03 [S]. Bottom: through notch |x| 10.6 down to z -7.85 for the display FPC and frame (they reach r 24.2, beyond any wall), inner pockets either side and below, and a 9.6 x 3.9 USB-C opening (shell 8.94 x 3.25) centred on the shell, open into the notch because the frame ends 0.05 above the shell. The user asked for an 8 x 2 hole 6 mm below the glass: too small for the shell; the shell top is 5.9 below the glass. PWR/BOOT pin holes (2.6) at +/-34.7 deg, z -8.1, direction inferred from the photo [?]. Fit check vs STEP mesh: contact only at the seat faces; tightest gaps 0.30 pins in bores, 0.36 USB sides, 0.45 notch floor to PCB tab.\n\n[2026-09-28] v1.0 printed and fits well. The user read the bottom opening as USB + microSD, but the strip under USB-C is the display FPC [S]. Waveshare's onboard-resources diagram (item 13) puts the TF socket on the FRONT of the PCB, between board and display, entering from the 9 o'clock edge (looking at the screen); v1.0 had no opening there. v1.1 adds a microSD slot at 9 o'clock: 12.6 wide (card 11) centred on y -0.73, z -6.9..-4.2 (socket -6.8..-4.33 [S]), with a 1.2 45-degree flare outside for a fingernail. Engraving now \"v1.1\". Fit check unchanged: contact only at the seats. Not changed: the bottom notch, which is sized to the STEP FPC tab (19.6 wide, reaching r 24.2); the user's photo suggests the real strip may be nearer 14 wide, so it can be tightened once measured.\n\n[2026-10-01] Closed: the user printed back cup v1.1 and confirmed the devboard fits (\"still a bit rough around the edges, but the devboard fits and we can work with that for awhile\"). Delivered: pinned plate PW-PP, then back cup v1.0 and v1.1 (pocketwatch/back_cup.stl, part=\"back_cup\"). Not done, filed as issue 29: edge finish, and tightening the bottom notch to the real FPC tab once measured. The screw variant plate.stl is unused because the standoff thread is unknown (M2 screws do not fit).", "type": "feature", "status": "done", "priority": "high", "file": "pocketwatch/pocketwatch.scad", "tags": ["pocketwatch", "backplate"], "created": "2026-09-28", "updated": "2026-10-01"}, {"id": 16, "summary": "Back cup v1.2: screws into the board's standoffs and an enclosed USB-C area, no front part", "description": "PW-F v1 would not take the module. The board-back photo shows the outline is not round near USB-C. Before remodelling, find what actually touched (pizero lesson: diagnose before changing a dimension): measure glass OD at several angles, the FPC tab width, depth and how far it reaches below the glass, and the USB-C position, and compare with the STEP values in pocketwatch.scad (lens_d 44.78, tab x +/-10.0 to y -23.12, z -1.7..-7.4). Then build front v2 to close onto the backplate (issue 15), with PWR and BOOT pushers in the band (both switches are side-actuated at the board edge) and room for the battery decided afresh.\n\n[2026-10-08] Scope changed by the user: no front part at all, no bezel and no ring. The board's curved cover glass sits on top of the case, flush, as the top surface. The case is the back cup only (issue 15), changed so that (1) the board is held by screws from the outside of the cup into its own three threaded standoffs, heads sunk in the floor (the PW-P plate approach from issue 15, which stalled because the user's M2 screws did not thread into the standoffs; thread still unknown, M1.6 suspected), replacing the locating pins; and (2) the 6 o'clock area is enclosed: today the cup has an open notch from the USB-C opening up to the rim because the display FPC tab and frame reach r 24.2 [S], outside the 46.8 band (r 23.4). A local bulge in the band at 6 o'clock with its inner face outside the tab encloses it and leaves only the USB-C opening; the board still drops in from the front because nothing on it is outside r 24.2. Blocking input: the standoff thread (try an M1.6 screw or measure the bore), and ideally the real FPC tab width (issue 29 suggests about 14 rather than the STEP's 19.6).\n\n[2026-10-08] Back cup v1.2 modelled: part=\"back_cup_v12\" in pocketwatch/pocketwatch.scad, pocketwatch/back_cup_v12.stl (make target), \"v1.2\" engraved. Board 6 o'clock geometry re-measured from the STEP mesh (rebuilt in a scratch venv with tools/step2stl.py; not committed): FPC lobes at |x| 5..9.8 reach y -23.12 for z -1.6..-4.75, frame to z -7.49, USB-C shell y -23.0 down to z -10.64; centre only to -22.39 (glass edge). Design: (1) countersunk screw holes through floor and seats into the standoffs, thread a parameter set to M1.6 x 7 [?] (DIN 965 head 3.0, clearance 1.8, sunk 0.5; engagement 2.51 of 3.51, asserted 1.5..3.21; the old plate formula ignored the head recess and would have put an M?x8 tip on the PCB). (2) Lug at 6 o'clock: band circle hulled with a flat face at y -24.8 (|x| 11.8, r 2 corners), 45 degree underside; inner pocket |x| < 10.6 to y -23.6 above z -7.9; plug overmould recess 13.1 x 7.6 to y -23.3; USB shell opening 9.6 x 3.9 as before. A strip of the frame shows inside the recess above a plugged-in cable. New tools/fitcheck_part.py checks one part against the mesh: contact only at the seat faces (z -10.90), as v1.1. Render previews looked right after fixing a pocket that first cut through the lug's outer wall.\nNot done: printing; the screw thread (user has no screws smaller than M2, which do not fit); lug shape is a tangent hull, so the case reads slightly pear-shaped at 6 o'clock.\n\n[2026-10-08] Closed: the user printed back cup v1.2 and reports it \"works better than the last\". The user has ordered micro screws, M1.2 or M1.4 (thread still unconfirmed). Not done, filed as issue 36: confirming the thread with the screws and fitting them.", "type": "feature", "status": "done", "priority": "high", "file": "pocketwatch/pocketwatch.scad", "tags": ["pocketwatch", "fit"], "created": "2026-09-28", "updated": "2026-10-08"}, {"id": 17, "summary": "Choose and pin the firmware toolchain", "description": "Gate for all firmware work. Waveshare supports two routes (docs.waveshare.com/ESP32-S3-Touch-LCD-1.46, Arduino and ESP-IDF pages, read 2026-10-01): (a) Arduino-ESP32 core 3.0.2 to 3.1.1 with LVGL 8.3.10 and ESP32-audioI2S 2.0.0, versions strictly coupled; (b) ESP-IDF 5.4.1 or later with the esp_lcd_spd2010 component and LVGL from the component manager.\n\nThis machine has PlatformIO Core 6.1.19 (used by ~/github/xroar-waveshare-rp2350-pizero) and arduino-cli, no ESP32 platform and no ESP-IDF. The official PlatformIO espressif32 platform only ships Arduino core 2.x, so Arduino 3.x needs the community pioarduino platform (github.com/pioarduino/platform-espressif32), pinned to the release carrying Arduino 3.1.1.\n\nRecommendation: PlatformIO + pioarduino, Arduino 3.1.1, LVGL 8.3.10, all pinned by exact version in platformio.ini. It keeps the same build/flash/monitor flow and docs/BUILD.md conventions as the pizero project, and stays inside Waveshare's tested versions so their SPD2010 driver code can be used as reference unchanged. Alternative if Arduino gets in the way: framework = espidf under the same platform (IDF 5.4). Done when the decision is recorded here and a pinned platformio.ini builds an empty sketch for the board.\n\n[2026-10-01] Decision: PlatformIO (user confirmed). Plan: pioarduino platform pinned to the release carrying Arduino-ESP32 3.1.1, LVGL 8.3.10, board memory type qio_opi (W25Q128 quad flash + 8 MB octal PSRAM), 16 MB partitions.\nData point considered: github.com/mast4rbug/ESP32_CoCo2_Emulator (ESP32-S3 CoCo 2 emulator, CC BY-NC 4.0) pins the official platform espressif32@6.11.0, i.e. Arduino 2.x on IDF 4.4, says it breaks on newer Arduino, and uses memory_type dio_opi with min_spiffs.csv. That conflicts with Waveshare's SPD2010 driver, which needs Arduino 3.0.2..3.1.1 (QSPI panel IO is believed to be IDF 5 only; unverified). Chose 3.x: the display is the board-specific hard part, and porting emulator code from 2.x to 3.x is mostly include/API renames.\nRemaining for done: a pinned platformio.ini that builds an empty sketch for this board.\n\n[2026-10-04] platformio.ini added: env 'board', platform pioarduino 53.03.11 by release-zip URL (installed framework-arduinoespressif32 reports 3.1.1, tool-esptoolpy 4.8.5), board esp32-s3-devkitc-1 overridden with memory_type qio_opi, flash_mode qio, 16MB flash, default_16MB.csv, BOARD_HAS_PSRAM, ARDUINO_USB_MODE=1, ARDUINO_USB_CDC_ON_BOOT=1. src/main.cpp is an empty sketch; 'pio run' builds it (cold build about 130 s; RAM 6.3%, flash 5.0% of a 6.25 MB app slot). LVGL 8.3.10 is not in lib_deps yet: it is added with the display work (issue 22/24), pinned to 8.3.10. Toolchain notes in docs/BUILD.md. Waiting on the user to confirm before closing.\n\n[2026-10-04] Closed with the user's go-ahead. Delivered: pinned platformio.ini (pioarduino 53.03.11 / Arduino 3.1.1) that builds an empty sketch for this board, toolchain section of docs/BUILD.md. Not done here: LVGL 8.3.10 pin, which lands with issues 22/24.", "type": "task", "status": "done", "priority": "high", "file": "platformio.ini", "tags": ["firmware", "toolchain"], "created": "2026-10-01", "updated": "2026-10-04"}, {"id": 18, "summary": "First contact: identify the board on USB and back up the factory flash", "description": "First thing to do with the board plugged in, before anything is flashed. The ESP32-S3 USB D-/D+ (GPIO19/20) go straight to the USB-C socket: there is no USB-UART bridge and no reset button. Expect a /dev/cu.usbmodem* port (USB-Serial/JTAG). Steps: (1) note the port and confirm the factory demo is running; (2) read chip info with esptool (chip_id, flash_id; expect ESP32-S3R8, 8 MB octal PSRAM, 16 MB W25Q128 flash); (3) read the full 16 MB flash to firmware-backup/factory-<date>.bin with a sha256 alongside, and keep it out of git (gitignore) but somewhere safe; (4) record the procedure and results in docs/BUILD.md. Recovery if a later build wedges USB: hold BOOT (GPIO0) while power-cycling to enter the ROM download mode (Waveshare Firmware-Flashing page). Waveshare's factory image is also in the Firmware directory of github.com/waveshareteam/ESP32-S3-Touch-LCD-1.46, flashed at 0x0, as a second fallback. Needs esptool, which comes with the PlatformIO ESP32 platform (issue 17) or pip.\n\n[2026-10-04] Done on the bench except step 1 (user to confirm the factory demo was running). Port /dev/cu.usbmodem101, Espressif USB JTAG_serial debug unit 303a:1001. esptool flash_id: ESP32-S3 (QFN56) rev v0.2, embedded 8 MB PSRAM, 40 MHz crystal, MAC 28:84:85:56:21:4c, flash manufacturer 0x20 device 0x4018 = XMC 128 Mbit (not the Winbond W25Q128 on the schematic; same size and QIO mode, no build change), 16 MB detected, quad flash in eFuse, 3.3 V. Full 16 MB read to firmware-backup/factory-2026-10-04.bin (gitignored), sha256 34b241754137c0f5cfa522bdac513b1bc7264efff9022f849ba72a2d499ae6eb, verify_flash against the chip: digest matched. Factory partitions: nvs 0x9000, factory app 0x10000 (3 MB), flash_test 0x310000, model (spiffs) 0x394000; app 'ESP32-S3-Touch-LCD-1.46-Test' v1 built Feb 24 2025 on IDF v5.4-dev. Procedure, restore command and results in docs/BUILD.md. Not done: a copy of the backup off this machine (user's call).\n\n[2026-10-04] Closed with the user's go-ahead. The user did not separately confirm the factory demo was on screen before the backup; the image itself is intact (app descriptor parsed, verify_flash matched). Off-machine copy of the backup is left to the user.", "type": "task", "status": "done", "priority": "high", "file": "docs/BUILD.md", "tags": ["firmware", "bringup"], "created": "2026-10-01", "updated": "2026-10-04"}, {"id": 19, "summary": "Board pin map and bring-up notes from the schematic", "description": "Write docs/pins.md and a single include/board_pins.h from docs/datasheets/ESP32-S3-Touch-LCD-1.46-schematic.pdf. No board needed. Extracted from the schematic netlist 2026-10-01 (verify against the GPIO table on page 1 when writing it up):\n- LCD (SPD2010, QSPI, J5): CS IO21, SCK IO40, SDA0 IO46, SDA1 IO45, SDA2 IO42, SDA3 IO41, TE IO18, RESET via expander EXIO2. Backlight BL_PWM IO5 (drives the MP1605 boost via Q3).\n- Touch (SPD2010): I2C SCL IO10 / SDA IO11, INT IO4, RESET via expander EXIO1.\n- Shared I2C bus IO10/IO11: touch, QMI8658 IMU, PCF85063 RTC, TCA9554 expander. IMU INT1/INT2 via EXIO5/EXIO4; RTC INT IO9.\n- TCA9554 expander: EXIO1 TP_RST, EXIO2 LCD_RST, EXIO3 SD_CS, EXIO4 IMU_INT2, EXIO5 IMU_INT1, EXIO6..8 spare (pulled up).\n- microSD (TF-07F): SCLK IO14, MISO/D0 IO16, MOSI/CMD IO17, CS via EXIO3 (SPI mode; D1/D2 pulled up).\n- Audio out PCM5101 + NS8002 amp: BCK IO48, DIN IO47, LRCK IO38. Mic MSM261S4030: WS IO2, SCK IO15, SD IO39.\n- Power: Key_BAT IO6 (PWR key sense), BAT_Control IO7 (power-hold latch via Q1/Q2), BAT_ADC IO8 (divider 200k/100k, so Vbat = 3 x Vadc).\n- BOOT key on GPIO0. USB D-/D+ on IO19/IO20 (native). UART0 TXD/RXD (IO43/44), IO1, IO3, IO12, IO13, 3V3, 5V and BAT on the 2x10 1.27 mm header J9.\n- Flash: external W25Q128 16 MB (QIO). PSRAM: 8 MB octal inside the S3R8.\nBring-up gotchas to record: the display cannot come out of reset until I2C and the TCA9554 are up; on battery the firmware must drive BAT_Control high early or the board turns off when PWR is released; IO45/IO46 are strapping pins used for LCD data.\n\n[2026-10-04] Written: docs/pins.md (GPIO table, TCA9554 port map, I2C bus, gotchas) and include/board_pins.h (constexpr pins, EXIO_* as port bit numbers). Checked against the rendered schematic GPIO table: every entry above matches. New from the IO Extension block: the schematic's Extend_IO1..8 are TCA9554 P0..P7, so EXIOn is port bit n-1 (TP_RST P0, LCD_RST P1, SD_CS P2, IMU_INT2 P3, IMU_INT1 P4); A1/A2 to GND, A0 a 0R/NC option (scan found 0x20); expander INT goes to GPIO0 only via R42, marked NC, so there is no expander interrupt. Flash is XMC on this unit, not W25Q128. Waiting on the user to review before closing.\n\n[2026-10-04] Closed with the user's review. Delivered docs/pins.md and include/board_pins.h. Not done: page 1 power-section details beyond the pins (latch polarity, charger STAT routing) are left to issue 25.", "type": "docs", "status": "done", "priority": "high", "file": "docs/pins.md", "tags": ["firmware", "docs"], "created": "2026-10-01", "updated": "2026-10-04"}, {"id": 20, "summary": "Firmware skeleton: pinned PlatformIO env, USB serial hello, docs/BUILD.md", "description": "Smallest firmware that proves the build-flash-monitor loop. platformio.ini env for ESP32-S3 with 16 MB flash (QIO), octal PSRAM enabled, USB CDC on boot (native USB, issue 18), a 16 MB partition table, and versions pinned per issue 17. src/main.cpp prints chip model, flash size, PSRAM size and free heap over USB serial once a second. docs/BUILD.md in the pizero project's style: envs, build, upload, monitor, the BOOT-while-power-cycling recovery, and where the factory backup lives. Done when the user has flashed it, seen the serial output, and the board survives a power cycle.\n\n[2026-10-04] platformio.ini came from issue 17. src/main.cpp prints a banner (chip model/rev/cores/MHz, flash size and speed, PSRAM size and found) at start and every 10 s, plus uptime, free heap and free PSRAM once a second. First write to the board (factory backup from issue 18 taken first); upload over /dev/cu.usbmodem101 auto-reset with no buttons, about 13 s. Serial read back: ESP32-S3 rev 2, 2 cores @ 240 MHz, flash 16777216 @ 80 MHz, PSRAM 8388608 found, heap free 350632, PSRAM free 8385672, steady. docs/BUILD.md written (toolchain, commands, USB recovery, backup/restore, first output). Remaining for done: the user sees the output with 'pio device monitor' and the board comes back after a power cycle (unplug/replug USB).\n\n[2026-10-04] Closed: the user saw the serial output after unplugging and replugging USB (\"that looks good\"). Build, flash, monitor and power-cycle survival all confirmed on the board. Also noted in docs/BUILD.md: pio device monitor needs a real TTY and fails under Claude Code's ! prefix; a non-interactive pyserial read is given instead. Not tested: the BOOT-while-power-cycling recovery path (not needed yet) and running on battery (issue 25).", "type": "feature", "status": "done", "priority": "high", "file": "platformio.ini", "tags": ["firmware", "toolchain"], "created": "2026-10-01", "updated": "2026-10-04"}, {"id": 21, "summary": "Shared I2C bus and TCA9554 expander driver", "description": "Gate for the display and touch, whose reset lines are on the expander (issue 19). Bring up I2C on IO10/IO11, scan and print every address found, and drive the TCA9554: configure EXIO1 (TP_RST) and EXIO2 (LCD_RST) as outputs and pulse them. Expected devices: TCA9554 (0x20 range, set by A0..A2 straps), QMI8658, PCF85063 (0x51), SPD2010 touch; record the actual addresses found in docs/pins.md rather than trusting typical values (pizero lesson).\n\n[2026-10-04] src/main.cpp now brings up Wire on IO10/IO11 at 400 kHz, scans 0x08..0x77, finds the TCA9554 in 0x20..0x27, latches outputs high, configures P0..P2 as outputs (cfg 0xf8), pulses TP_RST and LCD_RST low 20 ms, waits 200 ms, rescans; repeats scan and register dump every 10 s. Result on the board: 0x20 TCA9554, 0x51 PCF85063, 0x6b QMI8658 (SA0 high). Input register reads 0xfc while resets are held low, so the expander really drives P0/P1. SPD2010 touch (expected 0x53) does NOT answer before or after the reset pulse, nor 10 s later. Unverified theory: the SPD2010 is a display+touch chip and touch stays silent until the display side is initialised (Waveshare's example inits LCD first); carried to issue 23. Addresses recorded in docs/pins.md. Note the USB port renamed to /dev/cu.usbmodem1101 after a replug; uploads now auto-detect (docs/BUILD.md). Waiting on the user before closing.\n\n[2026-10-04] Closed with the user's go-ahead. Delivered: I2C bus up, addresses recorded, expander drives TP_RST/LCD_RST. Not done: the missing SPD2010 touch address, carried to issue 23 (likely needs the display initialised, issue 22).", "type": "feature", "status": "done", "priority": "high", "file": "src/", "tags": ["firmware", "bringup"], "created": "2026-10-01", "updated": "2026-10-04"}, {"id": 22, "summary": "Display: SPD2010 over QSPI with backlight", "description": "Biggest unknown in the bring-up. Drive the 412x412 SPD2010 panel over QSPI (pins in issue 19) through esp_lcd, using Waveshare's esp_lcd_spd2010 driver from their example repo as reference, with LCD reset via the expander (issue 21) and backlight PWM on IO5. Milestones: solid red/green/blue fills, a test pattern showing the round visible area and orientation (which way is 12 o'clock relative to the crown on the case), then a measured full-screen refresh rate. Record the init sequence source and any changes.\n\n[2026-10-04] Driver: Espressif esp_lcd_spd2010 2.0.0~1 vendored unmodified into lib/esp_lcd_spd2010 (esp-iot-solution 88152bff, Apache-2.0; VENDORED.md). Waveshare's Arduino copy differs only by two commented-out lines, so the default vendor init table is what Waveshare runs. Its SPD2010_PANEL_*_CONFIG macros do not compile as C++ (designator order), so src/display.cpp fills the structs field by field. Settings from Waveshare's example: SPI2_HOST, QSPI, mode 3, 40 MHz (upstream default 20), 32-bit cmd / 8-bit param, RGB order, big-endian RGB565 (pixels byte-swapped before sending). LCD reset via expander EXIO_LCD_RST low 50 ms / high 50 ms then esp_lcd_panel_reset (software). Backlight: LEDC on IO5, 20 kHz, 10 bit, set to 60% after the first fill. Drawing: full-width 40-row strips double-buffered in internal DMA RAM (2 x 32960 B), on_color_trans_done gives a counting semaphore. src/expander.{h,cpp} split out of main.cpp.\nMeasured on the board: init ok; full-screen solid fill 24.0 ms = 41.7 fps (wire-time floor at 40 MHz x 4 lines is about 17 ms); orientation pattern 44.7 ms (per-pixel maths is the extra). Heap free 276980 after init.\nSide result: SPD2010 touch now answers at 0x53 after display init (it did not after TP_RST alone, issue 21): display must be initialised before touch. Recorded in docs/pins.md and issue 23.\nWaiting on the user: are the fills red/green/blue/white in that order with correct colours, and which wedge colour sits next to the USB-C port and which by the crown (12 o'clock)?\n\n[2026-10-04] Closed: the user confirmed \"screen looks good\" and \"the colors are correct\" (RGB order and no inversion as configured). Orientation: the blue wedge, panel memory bottom (max y), sits next to the USB-C port. In the pocket-watch case USB-C and the FPC tab are at 6 o'clock and the crown/bow at 12, so panel row 0 is already 12 o'clock: no rotation or mirroring needed. All three milestones met (fills, orientation pattern, refresh rate 24.0 ms = 41.7 fps). Not done, filed as issue 30: tearing-free updates using LCD_TE (IO18) and trying a faster QSPI clock.", "type": "feature", "status": "done", "priority": "high", "file": "src/", "tags": ["firmware", "display"], "created": "2026-10-01", "updated": "2026-10-04"}, {"id": 23, "summary": "Touch: SPD2010 touch over I2C", "description": "Read touch points from the SPD2010 touch controller on the shared I2C bus with the interrupt on IO4 and reset on EXIO1. Print raw coordinates, confirm they map to display coordinates (rotation and mirroring match issue 22), and check behaviour at the round edge. Waveshare's example has a reference driver.\n\n[2026-10-04] From issue 21: the touch controller does not answer on I2C (no device at 0x53 or anywhere unexpected) after TP_RST is pulsed via the expander. Theory, unverified: it needs the display side of the SPD2010 initialised first (issue 22). First check here: scan again after the display init sequence has run.\n\n[2026-10-04] Confirmed in issue 22: touch answers at 0x53 once the display has been initialised over QSPI. Init order: expander, display, then touch.\n\n[2026-10-04] src/touch.{h,cpp}: protocol ported from Espressif esp_lcd_touch_spd2010 (esp-iot-solution, Apache-2.0) onto Arduino Wire (register write with STOP, then read; same as Waveshare). Reset via EXIO_TP_RST low 50 / high 50 ms after display init. Firmware info at 0x2600: DVer 0x006f, IC name SPD2010. INT on IO4 (falling, INPUT_PULLUP) is counted only: idle the controller pulses INT at 2 Hz (status byte1 toggles 0x08/0x18, len 0). Lesson: the state machine must be polled on every loop like the reference drivers; my first version ran only on INT or every 50 ms. Observed start-up: status 0xc0 BIOS -> cpu_start -> straight to RUN 0x08; the CPU (0x20) state that sends point-mode/start was never seen, yet point reports arrive, so the controller firmware starts scanning by itself. -DTOUCH_DEBUG (commented in platformio.ini) logs status changes.\nMeasured with the user's finger: 86 single-finger reports, x 70..382, y 60..389, reaching radius 201 of the 206 visible circle; weights 131..201; 27 lift events (weight 0). Multi-touch not yet exercised. Test app in src/main.cpp draws an 8x8 dot per finger (aligned to 4 px) and redraws the pattern after 5 s idle. Waiting on the user: do the dots appear under the finger (mapping), and a two-finger try.\n\n[2026-10-04] Closed: the user confirmed \"dots follow my finger, two fingers works too\". Touch coordinates map 1:1 onto display coordinates with no rotation, mirroring or offset (same frame as issue 22, where panel row 0 is 12 o'clock in the case). Multi-touch works. Not done, filed as issue 31: interrupt-driven reading (currently polled every 10 ms loop), and the gesture packets (check_id 0xF6) which are parsed out but ignored.", "type": "feature", "status": "done", "priority": "medium", "file": "src/", "tags": ["firmware", "touch"], "created": "2026-10-01", "updated": "2026-10-04"}, {"id": 24, "summary": "LVGL integration", "description": "LVGL 8.3.10 (Waveshare's tested version; their driver code depends on it, issue 17) with draw buffers in PSRAM, flush through the esp_lcd panel from issue 22 and an input driver from issue 23. Done when a simple round-screen UI responds to touch with smooth updates; record buffer sizes and frame rate. Moving to LVGL 9 is a later, separate decision.\n\n[2026-10-07] Done. LVGL 8.3.10 pinned in platformio.ini lib_deps; include/lv_conf.h generated from the 8.3.10 template (LV_COLOR_16_SWAP 1 so LVGL renders big-endian RGB565 for the bus, LV_MEM_CUSTOM 1, LV_TICK_CUSTOM millis(), refresh and input read 10 ms, perf monitor bottom-centre, Montserrat 14/28/48). src/lvgl_port.cpp: two 32960 B partial draw buffers (412 x 40 rows) in internal DMA RAM, not PSRAM: SPI DMA reads them directly and rendering stays out of PSRAM; async flush via new display_draw_async() with lv_disp_flush_ready from the SPI done interrupt; rounder aligns x1 down and x2 up to 4 px (SPD2010 requirement, as in Waveshare's port); monitor_cb prints refresh stats every 5 s. The display module's blocking-call strip buffers are now allocated lazily so LVGL-only programs do not pay 66 KB for them. src/ui.cpp demo: 270-degree brightness arc around the rim driving the real backlight (gap at 6 o'clock over USB-C), value label, tap-counter button, uptime clock at 12. Old raw display/touch test patterns removed from main.cpp (in git history, commit 6139609).\nMeasured: first full frame 169744 px in 42 ms; idle about 4 refreshes/s (clock + perf monitor); while dragging up to 25.6 refreshes/s at 3..8 ms each, i.e. refresh follows the touch report rate, not render or bus time. Free heap 268 KB after init.\nBug found and fixed: every tap counted twice. TOUCH_DEBUG log of 15 gestures showed the status register's pt_exist bit drops to 0 for one read 10..25 ms after the first point report of every touch, so LVGL saw press-release-press. Every gesture ends with exactly one weight-0 lift report, so src/touch.cpp now latches the press state from point reports and uses pt_exist only as a 150 ms fallback release. User retest: 10 taps count 10, ring still smooth.\nUser confirmed: \"smooth, brightness ring works\", then \"10 taps, says 10 now. ring still smooth\". Not done, filed as issue 32: PSRAM vs internal buffer comparison and a full-frame buffer option, and the LVGL 9 decision.", "type": "feature", "status": "done", "priority": "medium", "file": "src/lvgl_port.cpp", "tags": ["firmware", "lvgl"], "created": "2026-10-01", "updated": "2026-10-07"}, {"id": 25, "summary": "Power: hold latch, PWR key, battery voltage", "description": "Needed before the board can run from a battery in the pocket-watch case. Drive BAT_Control (IO7) high early in boot so the board stays on after PWR is released; read Key_BAT (IO6) for the PWR key (short press vs long-press power off); read BAT_ADC (IO8) and scale by 3 (200k/100k divider) with ADC calibration. Check what the ETA6098 charger exposes (STAT pin routing) and whether charge state can be read. Test on USB and on a cell.\n\n[2026-10-07] Circuit read from the schematic and recorded in docs/pins.md \"Power\": Q1/Q2 AO3401 in series from BAT to VCC; Q2 off while USB_5V is present; Q1 gate held low by the PWR key (via D4) or by T1 when BAT_Control (IO7) is high; Key_BAT (IO6) active low via D1 with R1 10k pull-up; BAT_ADC = BAT/3; ETA6098 STAT drives only the charge LED, so charge state is not readable (answers the STAT question in this issue: no).\nsrc/power.{h,cpp}: power_begin() first in setup() latches IO7 high on every boot (Waveshare latches only when PWR started the board, so pulling USB with a cell fitted would kill it) and gpio_hold_en keeps it through soft resets. Boot source (power key / USB / wake) from Key_BAT and the wakeup cause. power_key_poll(): 30 ms debounce, Short event, LongHeld at 2 s; ignores the press that powered the board on. power_off(): drop the latch, wait for release, then if still powered (USB) deep sleep with ext0 wake on IO6 low. Battery: 16-sample analogReadMilliVolts(8) x 3, no correction factor (Waveshare divides by 0.990476; not adopted until measured against a meter), plus a rough LiPo percent curve. Demo: short press toggles the backlight, long press shows \"Release PWR to power off\"; battery shown at 6 o'clock.\nTested by the user on USB with no cell: short press toggles the screen; 2 s hold powers off into deep sleep; PWR wakes it (board found running again). With no cell, BAT reads 4.16 V: charger output, not a battery.\nNot tested (no cell available): staying on when USB is pulled, full power-off on battery, power-on by PWR, the gpio_hold across a reset on battery, and the ADC scale against a meter.\n\n[2026-10-07] Closed at the user's choice (\"Close, file battery test\"): the circuit analysis, firmware and USB-side behaviour are delivered and verified. Battery-path tests and the ADC check against a meter need a cell and are filed as issue 33.", "type": "feature", "status": "done", "priority": "medium", "file": "src/power.cpp", "tags": ["firmware", "power"], "created": "2026-10-01", "updated": "2026-10-07"}, {"id": 26, "summary": "Sensors: QMI8658 IMU and PCF85063 RTC", "description": "Read accelerometer/gyro from the QMI8658 (interrupts via expander EXIO4/EXIO5) and keep time with the PCF85063 (INT IO9). The IMU can drive screen orientation or wrist/raise-to-wake later; the RTC keeps time across power cycles.\n\n[2026-10-07] Done. src/imu.{h,cpp}: QMI8658 at 0x6B (SA0 tied to GND, which on this part selects 0x6B; docs/pins.md previously said \"SA0 high\", corrected). Soft reset (0x60 <- 0xB0), WHO_AM_I 0x05 / revision 0x05, CTRL1 0x40 auto-increment, accel +/-4 g and gyro +/-512 dps at 117.5 Hz (CTRL2 0x16, CTRL3 0x56), LPFs on (CTRL5 0x11), CTRL7 0x03; one 14-byte burst from 0x33 for temperature, accel, gyro. At rest 0.978 g, 33 C; gyro zero offset about +2.5/+1.9/-0.2 dps. Axes measured with the user tilting the board: +x to 12 o'clock, +y to 3 o'clock, +z out of the back (right-handed, consistent with -0.97 g on z lying screen-up).\nsrc/rtc.{h,cpp}: PCF85063 at 0x51 holds UTC in BCD; the local offset (15-minute steps) lives in its RAM byte so it survives with the time; the OS flag marks lost time. Serial command \"t <unix_utc> <offset_min>\" sets it (set from the Mac: EDT, -240). Survived a hardware reset as valid. Schematic: RTC powered from 3V3 via D2, J2 backup-cell footprint unfitted, so time survives only while the board has power (always on USB).\nDemo: local time and date at 12 o'clock, spirit-level bubble from the IMU (user first saw a downhill ball, asked for a bubble; flipped to uphill).\nUser confirmed: tilt directions reported and consistent, \"time and date are right\". The bubble direction is the sign-flip of the verified ball mapping and was flashed without a separate re-check. Not done, filed as issue 34.", "type": "feature", "status": "done", "priority": "low", "file": "src/imu.cpp", "tags": ["firmware", "sensors"], "created": "2026-10-01", "updated": "2026-10-07"}, {"id": 27, "summary": "microSD and audio", "description": "microSD over SPI (SCLK IO14, MISO IO16, MOSI IO17, CS via EXIO3), FAT32. Audio out through the PCM5101 DAC on I2S (BCK IO48, DIN IO47, LRCK IO38) into the NS8002 amp and the onboard speaker; mic input from the MSM261S4030 (I2S, IO2/IO15/IO39). The microSD slot is reachable through back cup v1.1.", "type": "feature", "status": "open", "priority": "low", "file": "src/", "tags": ["firmware", "storage", "audio"], "created": "2026-10-01", "updated": "2026-10-01"}, {"id": 28, "summary": "Wi-Fi bring-up and network time", "description": "Connect to Wi-Fi with credentials kept out of git, sync time by NTP and write it to the RTC (issue 26). Basis for anything networked later (OTA updates, data feeds).\n\n[2026-10-08] src/net.{h,cpp}: Wi-Fi station with credentials in NVS (namespace \"wifi\"), set by the serial command wifi \"<ssid>\" \"<password>\" and never echoed or logged (the user gave the credentials in the session; they are only in the board's NVS, checked absent from the repo and logs). Auto-reconnect; modem sleep off. SNTP (pool.ntp.org, time.google.com, time.cloudflare.com, UTC) is started 3 s after each connect via configTime, which takes the TCPIP core lock itself; each sync writes UTC to the RTC. UI shows \"wifi -NN dBm\" above the battery line. Serial commands documented in docs/BUILD.md.\nDebugging, for the record: the first sync worked, then none did. Diagnostics showed DNS timing out, no NTP reply even to a literal Google IP, and no reply to pings from the Mac, while ARP worked and the Mac's own DNS/NTP through the same router were fine; not power save (setSleep(false) no change), not the eero node (two BSSIDs). Cause: the user's Fing device blocker was blocking the board as a new device; Fing blocks by ARP spoofing, so after the user unblocked it the board also needed a reconnect to clear the gateway's ARP entry. Then: DNS ok, time.google.com replies in 15..25 ms, SNTP syncs 0.3..5 s after connect, also after a reset.\nTwo bugs found on the way: (1) WiFi.hostByName() in Arduino-ESP32 3.1.1 clears the lwIP DNS cache without the TCPIP core lock, which ran SNTP's pending DNS callback unlocked and asserted (udp_new_ip_type, \"Required to lock TCPIP core functionality\"); the ntp diagnostic no longer calls it. (2) The local offset lived in the RTC RAM byte and was lost with the time on a power loss, so NTP restored the time with offset 0; the offset now lives in NVS (\"time\"/\"offset_min\"), verified across a reflash. Also removed analogSetPinAttenuation in power.cpp, which logged an ADC error at boot.\nWaiting on the user to confirm the screen shows the Wi-Fi status and the right local time.\n\n[2026-10-08] Closed: the user confirmed \"yes all good\" (Wi-Fi status shown, local time correct). Not done, filed as issue 35: OTA updates, provisioning without a serial cable, and Wi-Fi power use on battery. DST/time-zone rules stay with issue 34.", "type": "feature", "status": "done", "priority": "low", "file": "src/net.cpp", "tags": ["firmware", "network"], "created": "2026-10-01", "updated": "2026-10-08"}, {"id": 29, "summary": "Back cup polish: edge finish", "description": "Filed from issue 15 when it closed. v1.1 prints and fits but is rough around the edges. The bottom notch is sized to the STEP model's FPC tab (cup_notch_hw 10.6, notch down to z -7.85); the user's photo suggests the real tab is nearer 14 wide. Measure the tab width and reach, tighten the notch, and look at chamfers/edge quality on the rim and flank.\n\n[2026-10-08] Trimmed (tidy-up with the user): the bottom notch no longer exists; back cup v1.2 (issue 16) replaced it with an enclosed lug sized from the STEP mesh. What remains is edge finish on the rim and flank: chamfers or rounds where the print reads rough. Applies to back_cup_v12 in pocketwatch/pocketwatch.scad.", "type": "feature", "status": "open", "priority": "low", "file": "pocketwatch/pocketwatch.scad", "tags": ["pocketwatch", "cosmetic"], "created": "2026-10-01", "updated": "2026-10-08"}, {"id": 30, "summary": "Display: tear-free updates on LCD_TE and a faster QSPI clock", "description": "Filed from issue 22 when it closed. The SPD2010 runs at 40 MHz QSPI (Waveshare's tested value) and a full-screen fill takes 24.0 ms (41.7 fps) against a wire-time floor of about 17 ms. Two follow-ups, neither needed for LVGL bring-up: (1) LCD_TE is wired to IO18 (board_pins.h PIN_LCD_TE) but unused; Waveshare's example oddly sets it as an OUTPUT. Sync full-frame writes to the TE edge if tearing shows in animation. (2) Try 80 MHz (integer divisor of 80 MHz APB) in src/display.cpp LCD_PCLK_HZ and check for corruption; also time the per-strip overhead (24 ms vs 17 ms) and whether larger strips or PSRAM buffers help.", "type": "feature", "status": "open", "priority": "low", "file": "src/display.cpp", "tags": ["firmware", "display"], "created": "2026-10-04", "updated": "2026-10-04"}, {"id": 31, "summary": "Touch: interrupt-driven reads and gesture packets", "description": "Filed from issue 23 when it closed. src/touch.cpp polls the SPD2010 status register on every loop pass (about 100 Hz), because a version that ran only on INT (IO4, falling) or every 50 ms missed touches; INT is currently only counted. Idle, the controller pulses INT at 2 Hz. For battery life (issue 25) find a read policy that keys off INT, e.g. poll fast only while INT activity or a touch is in progress and slowly otherwise, and confirm no touches are lost. Also: the controller's gesture packets (HDP check_id 0xF6, gesture = byte 6 & 0x07) are not decoded; decide whether LVGL needs them or software gestures are enough.", "type": "feature", "status": "open", "priority": "low", "file": "src/touch.cpp", "tags": ["firmware", "touch", "power"], "created": "2026-10-04", "updated": "2026-10-04"}, {"id": 32, "summary": "LVGL: buffer placement experiments and the LVGL 9 decision", "description": "Filed from issue 24 when it closed. LVGL 8.3.10 runs with two 412 x 40 row draw buffers (32960 B each) in internal DMA RAM (src/lvgl_port.cpp BUF_ROWS); refresh is touch-limited at up to 25.6/s with 3..8 ms per refresh, so there is no pressure yet. Open: (1) measure the same UI with buffers in PSRAM (8 MB, nearly all free) and with larger or full-frame buffers, once a heavier screen (animations, images, emulator output) needs it; record render ms and refresh rate for each. (2) Decide whether to move to LVGL 9 (new display/indev API, lv_conf changes). Waveshare's driver code is pinned to 8.3.10, but this project now has its own port, so that constraint no longer binds.", "type": "task", "status": "open", "priority": "low", "file": "src/lvgl_port.cpp", "tags": ["firmware", "lvgl"], "created": "2026-10-07", "updated": "2026-10-07"}, {"id": 33, "summary": "Power: verify the battery path on a real cell and calibrate BAT_ADC", "description": "Filed from issue 25 when it closed. The power firmware (src/power.cpp; circuit in docs/pins.md \"Power\") was only tested on USB with no cell: short press, 2 s power-off into deep sleep and PWR wake all work there. With a single-cell LiPo on the MX1.25 connector, test: (1) unplug USB while running: board keeps running, no reset (latch held on every boot); (2) on battery, hold PWR 2 s and release: board turns fully off (no deep sleep, no current draw; measure if possible); (3) on battery, hold PWR about 1 s: powers on and stays on after release (find the minimum hold time); (4) trigger a software reset on battery (e.g. a serial command calling esp_restart): board comes back without going off, proving gpio_hold_en on IO7 works across a reset; (5) compare power_battery_volts() with a multimeter on the cell at two or three charge levels and decide whether a correction is needed (Waveshare divides by 0.990476; not adopted); (6) note the charge LED behaviour and whether Vbat on USB tells charging from full well enough for a UI hint. Record results in docs/pins.md.", "type": "task", "status": "open", "priority": "medium", "file": "src/power.cpp", "tags": ["firmware", "power", "battery"], "created": "2026-10-07", "updated": "2026-10-07"}, {"id": 34, "summary": "RTC and IMU follow-ups: time kept on battery power-off, gyro offset, IMU interrupts", "description": "Filed from issue 26 when it closed (drivers in src/rtc.cpp and src/imu.cpp, notes in docs/pins.md \"RTC and IMU\"). (1) The PCF85063 is powered from 3V3 through D2 and J2 (backup cell footprint) is unfitted, so a full power-off on battery (issue 33) loses the time; options are a small cell or supercap on J2, or accept it and set the time from Wi-Fi/NTP (issue 28). (2) Measure RTC drift over a day against the Mac; Control_1 CAP_SEL is left at the default 7 pF while the crystal has external 22 pF caps, so check whether 12.5 pF fits better. (3) Time zone is a fixed UTC offset with no DST rules; decide whether a POSIX TZ string (stored in NVS) is worth it. (4) Gyro zero offset at rest is about +2.5/+1.9/-0.2 dps: calibrate at start-up (average while still) if gyro is used. (5) QMI8658 INT1/INT2 reach the expander inputs P4/P3 (no expander interrupt line, issue 21), so motion wake or raise-to-wake needs polling or the QMI8658 motion engine plus expander polling; design with power (issues 31, 33).", "type": "task", "status": "open", "priority": "low", "file": "src/rtc.cpp", "tags": ["firmware", "sensors", "rtc"], "created": "2026-10-07", "updated": "2026-10-07"}, {"id": 35, "summary": "Network follow-ups: OTA updates, provisioning without serial, Wi-Fi power on battery", "description": "Filed from issue 28 when it closed (src/net.cpp; commands in docs/BUILD.md). (1) OTA firmware updates over Wi-Fi (ArduinoOTA or HTTP pull); default_16MB.csv already has two 6.25 MB app slots, and the app is 1.35 MB. Needs an auth secret kept out of git like the Wi-Fi credentials. (2) Provisioning without a USB serial cable once the board is in the case: a setup access point with a captive page, or BLE provisioning; today credentials are set only with the serial `wifi` command. (3) Wi-Fi power on battery: modem sleep is off (WiFi.setSleep(false)) after a debugging step that turned out not to be the cause (the Fing blocker was); re-enable it and confirm unicast still works on the eero, then decide when Wi-Fi is on at all (e.g. connect, sync NTP, disconnect) with issue 33's battery measurements.", "type": "feature", "status": "open", "priority": "low", "file": "src/net.cpp", "tags": ["firmware", "network"], "created": "2026-10-08", "updated": "2026-10-08"}, {"id": 36, "summary": "Back cup v1.2: identify the standoff thread and fit the screws", "description": "Filed from issue 16 when it closed. Back cup v1.2 (pocketwatch/back_cup_v12.stl) is printed and fits better than v1.1, but the board is not yet screwed in: the standoffs are not M2 despite the Waveshare drawing (\"3*M2.00-H3.5\"); the user's M2 screws do not fit [M]. The user has ordered micro screws, M1.2 or M1.4. The holes are sized for M1.6 (clearance 1.8, DIN 965 head 3.0 countersink sunk 0.5), so M1.2/M1.4 pass through and their smaller heads sit deeper. Length: engagement = 0.5 + L - 4.99 must be 1.5..3.21 (floor 2.4 + seat 2.59, standoff 3.51), so L = 6 or 7, 7 preferred; 8 or more reaches the PCB. Steps: find which size threads into a standoff; set cup_screw_d, cup_screw_clear and cup_screw_head_d in pocketwatch.scad to match (a closer clearance and head seat if the heads sit visibly deep); re-run tools/fitcheck_part.py; record the real thread in docs/board-specs.md and docs/pins.md (it contradicts the drawing). The user also wonders about M1.0. Evidence against: the PW-PP plate's printed 1.0 mm pins dropped into the standoff bores (issue 15), and thread minor diameters are about M1.0 0.73, M1.2 0.89, M1.4 1.05, M1.6 1.22, so M1.4 is most likely, M1.2 possible if the pins printed undersize, M1.0 unlikely. Measuring the pin that fitted would narrow it.", "type": "task", "status": "open", "priority": "medium", "file": "pocketwatch/pocketwatch.scad", "tags": ["pocketwatch", "fasteners"], "created": "2026-10-08", "updated": "2026-10-08"}, {"id": 37, "summary": "Back cup: room for the 20 x 30 mm LiPo cell", "description": "The user has a 20 x 30 mm LiPo pouch cell (thickness not yet measured: a 402030 is 4.0, a 502030 5.0) to fit in the case. Back cup v1.2 (issue 16, pocketwatch/back_cup_v12.stl) has no room for it: the deepest part of the board, the 2x10 1.27 mm header (x -17.0..-11.5, y -6.1..6.3, tips z -12.95 [S]), clears the inside floor (z -13.5) by only 0.55, and the standoff seats are 2.59 tall. The cell has to go behind the board, so the cup gets deeper by about cell thickness + 0.5 air + 0.3 slack (5.8 for a 5.0 cell, as the phase-1 design computed: rim_z = header_tip_z - bat_gap - bat_t - bat_slack), with taller seats or a lower floor and the screws lengthened to match (engagement rule in issue 36). Phase 1 (issue 3, pocketwatch.scad module back(), parameters bat_*) already had a cradle for this cell behind the header, centred at y -2.15, clear of the two lower standoffs and under the PWR switch; reuse its layout. Also: the board's battery connector is an MX1.25 2-pin [W]; route the lead so it does not foul the microSD slot at 9 o'clock or the speaker (issue 8); keep the PWR and BOOT holes (side-actuated switches at the board edge) reachable. Needed before the board can run in the case on battery (issue 33 tests can run with the cell outside the case first).\n\n[2026-10-08] The user thinks there is already room. Checked against the STEP mesh and the v1.2 cup mesh: over the best 30 x 20 footprint (long side along x, centred near (2, 0)) the deepest board parts reach z -10.1..-10.45, the 2x10 header (z -12.95) sits at x -17..-11.5 beside it, and the inside floor is z -13.5, so there is 3.4 mm under the board. But the flat floor is only 38.1 across before the 45 degree flank (inner wall r about 18.6 at the floor, 21.39 from z -10.6 up), so the cell's corners (r 18..20) land on the flank and it must sit about 1.4 higher: 1.3 mm of room. A 3 mm cell is 1.7 short, 4 mm 2.7 short, 5 mm 3.7 short. Options: widen the flat base (back to about 3.4 mm of room) and deepen the cup by the remainder. Waiting on the user: cell thickness (model number), and a dry fit of the cell under the board in the printed v1.2 cup (does the board still sit on its seats?).", "type": "feature", "status": "open", "priority": "medium", "file": "pocketwatch/pocketwatch.scad", "tags": ["pocketwatch", "battery"], "created": "2026-10-08", "updated": "2026-10-08"}, {"id": 38, "summary": "Adopt the baseline contribution policy (CONTRIBUTING.md)", "description": "Stamped CONTRIBUTING.md from the user's baseline template with the project name and tracker filled in. The tracker already existed, so unlike a genesis stamp this issue was filed alongside the work in the same session rather than before it. Open until the user reviews the stamped file; project-specific rules go in the stamped copy, not the template.", "type": "task", "status": "open", "priority": "low", "file": "CONTRIBUTING.md", "tags": ["process"], "created": "2026-10-11", "updated": "2026-10-11"}, {"id": 39, "summary": "Publish the repo publicly on GitHub", "description": "The user asked to push to a public GitHub repo to share it. Pre-publish check: no Wi-Fi credentials or other secrets in the tree or history (credentials live only in NVS); the board's Wi-Fi MAC appears in issue text, judged low risk. firmware-backup/ (16 MB factory image) and .pio/ are gitignored and stay local. Tracked third-party material: the Thingiverse case in hardware/ (CC BY-SA, attribution kept), vendored esp_lcd_spd2010 (its own licence file), and Waveshare datasheet PDFs in docs/datasheets/.\n\n[2026-10-11] Closed: public at https://github.com/ugufru/waveshare-esp32s3-146-round, main pushed and tracking origin. Root README and licence filed as issue 40.", "type": "task", "status": "done", "priority": "medium", "file": "", "tags": ["process"], "created": "2026-10-11", "updated": "2026-10-11"}, {"id": 40, "summary": "Root README for the public repo", "description": "Filed from issue 39. The repo has no top-level README, so the GitHub landing page shows only the file list, and no top-level licence, so the project's own code and designs are all-rights-reserved by default. Write a short root README (what the board is, what works: display, touch, LVGL, power, IMU, RTC, Wi-Fi/NTP; the pocket-watch case; pointers to docs/BUILD.md, docs/board-specs.md, pocketwatch/README.md, the issues page) and choose a licence. The pocket-watch case is not derived from the Thingiverse case, but confirm that before picking a licence that differs from CC BY-SA. Also decide whether the Waveshare datasheet PDFs should stay committed or be replaced with links.\n\n[2026-10-11] README.md written for a newcomer with minimal investment: what the board and demo are, parts (cover-glass SKU 29565, data USB-C cable, optional printer and 2.4 GHz Wi-Fi), PlatformIO install (brew or pipx, Linux udev rules), clone, `pio run -t upload`, BOOT recovery, setting the clock over serial (wifi, tz, t), printing back_cup_v12.stl, what's not done, credits. Rescoped to the README; the licence and the datasheet PDFs moved to issue 41. Awaiting user review.", "type": "task", "status": "open", "priority": "medium", "file": "", "tags": ["docs", "process"], "created": "2026-10-11", "updated": "2026-10-11"}, {"id": 41, "summary": "Choose a licence; decide on the committed Waveshare PDFs", "description": "Filed from issue 40. The repo is public with no top-level licence, so the project's own firmware and case designs are all-rights-reserved by default; README.md says a licence has not been chosen. Pick one (the pocket-watch case is not derived from the Thingiverse case in hardware/, which is CC BY-SA; confirm before choosing something different) and add LICENSE plus the README line. Also decide whether docs/datasheets/*.pdf (Waveshare's) stay committed or become links; docs/board-specs.md already has the URLs.\n\n[2026-10-11] Closed: the user chose MIT. LICENSE added (Copyright (c) 2026 Paul Cunningham); README.md says MIT covers the project's own firmware, case designs, tools and docs, and that lib/esp_lcd_spd2010 (Apache-2.0), hardware/ (CC BY-SA) and the Waveshare PDFs keep their own terms. The datasheet PDF question is filed as issue 42.", "type": "task", "status": "done", "priority": "medium", "file": "", "tags": ["docs", "process"], "created": "2026-10-11", "updated": "2026-10-11"}, {"id": 42, "summary": "Decide whether to keep Waveshare's datasheet PDFs committed", "description": "Filed from issue 41. docs/datasheets/ holds three Waveshare PDFs (schematic and two structural drawings) in a public repo. Keep them (convenient, and they pin the revision the case was measured against) or replace them with the links already in docs/board-specs.md.", "type": "task", "status": "open", "priority": "low", "file": "docs/datasheets/", "tags": ["docs"], "created": "2026-10-11", "updated": "2026-10-11"}], "roadmap": [{"rank": 1, "id": 36, "why": "Small and waiting only on the screws in the post: it turns the printed v1.2 cup into a closed, held case. Settles the standoff thread, which contradicts Waveshare's drawing.", "added": "2026-10-08"}, {"rank": 2, "id": 33, "why": "Blocked on a cell: do it as soon as one is connected. The battery path is the reason the power firmware exists and none of it has run on a cell yet; a wrong latch means a watch that dies when unplugged.", "added": "2026-10-07"}, {"rank": 3, "id": 37, "why": "The last thing between the printed case and a watch that runs untethered: the cup has zero space behind the board today. Pairs with #33 (prove the battery firmware) and should follow #36 so the screw length is settled for the deeper cup.", "added": "2026-10-08"}]}</script>
<script>
(function () {
  var STATUS_ORDER = ['open', 'in-progress', 'done', 'deferred', 'wontfix'];
  var PRIORITY_ORDER = ['high', 'medium', 'low'];
  var TAG_PILL_LIMIT = 20;   // the rest hide behind a "+N more" toggle
  // Themes are the coarse grouping: one per issue, from a fixed vocabulary,
  // unlike the free-form tags. Order is the order they are worked in.
  var THEME_ORDER = ['trust', 'kit', 'input', 'experience', 'platform', 'storage', 'devices'];
  var LIVE = ['open', 'in-progress'];
  var KEY = 'issues-view:' + location.pathname;
  // Longest alternative first: "jsonl" must win over "json".
  var PATH_RE = /\b((?:[\w.-]+\/)*[\w.-]+\.(?:jsonl|json|md|html|css|js|ts|tsx|jsx|py|rb|go|rs|java|c|h|cpp|sh|toml|ya?ml|cfg|ini|txt|bas|dsk|png))(:\d+(?:-\d+)?)?/g;

  var issues = [];
  var active = { status: [], type: [], tag: [], theme: [] };
  var q = document.getElementById('q');
  var list = document.getElementById('list');
  var count = document.getElementById('count');
  var empty = document.getElementById('empty');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function rank(v, order) {
    var i = order.indexOf(v);
    return i === -1 ? order.length : i;
  }

  function markup(text) {
    return String(text).split('\n\n').map(function (para) {
      return '<p>' + esc(para).replace(PATH_RE, '<code>$&</code>').replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }

  function summaryOf(i) { return i.summary || i.title || '(untitled)'; }
  function tagsOf(i) { return i.tags || i.labels || []; }

  function card(i) {
    var status = i.status || '?', priority = i.priority || '?', type = i.type || '?';
    var el = document.createElement('article');
    el.className = 'card';
    el.id = 'i' + i.id;
    el.dataset.status = status;
    el.dataset.type = type;
    el.dataset.tags = tagsOf(i).join(' ');
    el.dataset.theme = i.theme || '';
    el.innerHTML =
      '<header><button class="row" aria-expanded="false">' +
      '<span class="id">#' + esc(i.id) + '</span>' +
      '<span class="summary">' + esc(summaryOf(i)) + '</span>' +
      '<span class="chips">' +
        '<span class="chip st-' + esc(status) + '">' + esc(status) + '</span>' +
        '<span class="chip pr-' + esc(priority) + '">' + esc(priority) + '</span>' +
        '<span class="chip ty">' + esc(type) + '</span>' +
        (i.theme ? '<span class="chip th">' + esc(i.theme) + '</span>' : '') +
      '</span><span class="caret" aria-hidden="true"></span></button></header>' +
      '<div class="body" hidden><div class="desc">' +
      markup(i.description || '(no description)') + '</div><footer>' +
      tagsOf(i).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') +
      '<span class="meta"><code>' + esc(i.file || '-') + '</code> &middot; created ' +
      esc(i.created || '?') + ' &middot; updated ' + esc(i.updated || '?') +
      '</span></footer></div>';
    el.querySelector('.row').addEventListener('click', function () {
      setOpen(el, el.querySelector('.body').hidden);
    });
    return el;
  }

  function setOpen(el, open) {
    el.querySelector('.row').setAttribute('aria-expanded', open);
    el.querySelector('.body').hidden = !open;
  }

  // The roadmap stores only rank, id and why. Everything shown here is joined
  // from the tracker, so an entry pointing at a missing or finished issue is
  // visibly wrong rather than quietly stale.
  function drawRoadmap(plan, byId) {
    if (!plan.length) return;
    var host = document.getElementById('plan');
    plan.slice().sort(function (a, b) { return (a.rank || 0) - (b.rank || 0); })
      .forEach(function (e) {
        var issue = byId[e.id];
        var li = document.createElement('li');
        li.className = 'step';
        var head, warn = '';
        if (!issue) {
          head = '#' + esc(e.id) + ' is not in the tracker';
          warn = 'no such issue';
          li.className += ' bad';
        } else {
          head = '<a href="#i' + esc(e.id) + '">#' + esc(e.id) + ' ' +
                 esc(summaryOf(issue)) + '</a> <span class="chip st-' +
                 esc(issue.status) + '">' + esc(issue.status) + '</span>';
          if (LIVE.indexOf(issue.status) === -1) {
            warn = 'already ' + issue.status + ', take it off the roadmap';
            li.className += ' bad';
          }
        }
        li.innerHTML = '<span class="rank">' + esc(e.rank || '?') + '.</span>' +
          '<span class="what">' + head +
          '<span class="why">' + esc(e.why || '') + '</span>' +
          (warn ? '<span class="warn">' + esc(warn) + '</span>' : '') + '</span>';
        var link = li.querySelector('a');
        if (link) {
          link.addEventListener('click', function () {
            var target = document.getElementById('i' + e.id);
            if (target) { target.hidden = false; setOpen(target, true); }
          });
        }
        host.appendChild(li);
      });
    document.getElementById('roadmap').hidden = false;
  }

  function pills(host, filter, values, counts, limit) {
    var hidden = (limit && values.length > limit) ? values.length - limit : 0;
    document.getElementById(host).innerHTML = values.map(function (v, idx) {
      var extra = hidden && idx >= limit;
      return '<button class="pill' + (extra ? ' extra' : '') + '"' +
        (extra ? ' hidden' : '') +
        ' data-filter="' + filter + '" data-value="' + esc(v) + '">' +
        esc(v) + (counts ? ' <span class="n">' + counts[v] + '</span>' : '') + '</button>';
    }).join('') + (hidden
      ? '<button class="morebtn" data-host="' + host + '">+' + hidden + ' more</button>'
      : '');
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ active: active, q: q.value }));
    } catch (e) {}
  }

  function apply() {
    var needle = q.value.trim().toLowerCase();
    var shown = 0;
    [].forEach.call(list.children, function (el) {
      var ok =
        (!active.status.length || active.status.indexOf(el.dataset.status) !== -1) &&
        (!active.type.length || active.type.indexOf(el.dataset.type) !== -1) &&
        (!active.theme.length || active.theme.indexOf(el.dataset.theme) !== -1) &&
        (!active.tag.length || active.tag.some(function (t) {
          return el.dataset.tags.split(' ').indexOf(t) !== -1;
        })) &&
        (!needle || el.textContent.toLowerCase().indexOf(needle) !== -1);
      el.hidden = !ok;
      if (ok) shown++;
    });
    empty.hidden = shown !== 0;
    count.textContent = shown + ' of ' + issues.length + ' shown';
    [].forEach.call(document.querySelectorAll('.pill'), function (p) {
      p.setAttribute('aria-pressed', active[p.dataset.filter].indexOf(p.dataset.value) !== -1);
    });
    save();
  }

  function draw(data, plan, note) {
    issues = data.slice().sort(function (a, b) {
      return rank(a.status, STATUS_ORDER) - rank(b.status, STATUS_ORDER) ||
             rank(a.priority, PRIORITY_ORDER) - rank(b.priority, PRIORITY_ORDER) ||
             (a.id || 0) - (b.id || 0);
    });

    var counts = {}, byId = {};
    STATUS_ORDER.forEach(function (s) { counts[s] = 0; });
    issues.forEach(function (i) {
      counts[i.status] = (counts[i.status] || 0) + 1;
      byId[i.id] = i;
    });

    list.innerHTML = '';
    issues.forEach(function (i) { list.appendChild(card(i)); });
    drawRoadmap(plan || [], byId);

    pills('f-status', 'status', STATUS_ORDER.filter(function (s) { return counts[s]; }), counts);
    pills('f-type', 'type', unique(issues.map(function (i) { return i.type || '?'; })));

    var themeCounts = {};
    issues.forEach(function (i) {
      if (i.theme) themeCounts[i.theme] = (themeCounts[i.theme] || 0) + 1;
    });
    var themes = THEME_ORDER.filter(function (t) { return themeCounts[t]; })
      .concat(Object.keys(themeCounts).filter(function (t) {
        return THEME_ORDER.indexOf(t) === -1;
      }).sort());
    document.getElementById('f-theme').parentNode.hidden = !themes.length;
    pills('f-theme', 'theme', themes, themeCounts);
    // A project can accumulate hundreds of tags, most of them used once.
    // Showing every one buries the results, so lead with the most used and
    // keep the long tail behind a toggle.
    var tagCounts = {};
    issues.forEach(function (i) {
      tagsOf(i).forEach(function (t) { tagCounts[t] = (tagCounts[t] || 0) + 1; });
    });
    var tagNames = Object.keys(tagCounts).sort(function (a, b) {
      return tagCounts[b] - tagCounts[a] || (a < b ? -1 : a > b ? 1 : 0);
    });
    pills('f-tag', 'tag', tagNames, tagCounts, TAG_PILL_LIMIT);

    [].forEach.call(document.querySelectorAll('.pill'), function (p) {
      p.addEventListener('click', function () {
        var l = active[p.dataset.filter], i = l.indexOf(p.dataset.value);
        if (i === -1) l.push(p.dataset.value); else l.splice(i, 1);
        apply();
      });
    });

    [].forEach.call(document.querySelectorAll('.morebtn'), function (b) {
      b.addEventListener('click', function () {
        var host = document.getElementById(b.dataset.host);
        var extras = host.querySelectorAll('.pill.extra');
        var show = extras.length && extras[0].hidden;
        [].forEach.call(extras, function (p) { p.hidden = !show; });
        b.textContent = show ? 'fewer' : '+' + extras.length + ' more';
      });
    });

    var open = (counts.open || 0) + (counts['in-progress'] || 0);
    document.getElementById('lede').innerHTML =
      issues.length + ' issues, ' + open + ' of them still open' +
      ((plan && plan.length) ? ', ' + plan.length + ' on the roadmap' : '') +
      '. Read from <code>issues.jsonl</code>.';
    if (note) {
      var n = document.getElementById('note');
      n.textContent = note;
      n.hidden = false;
    }

    try {
      var s = JSON.parse(localStorage.getItem(KEY) || '{}');
      if (s.active) active = s.active;
      if (s.q) q.value = s.q;
    } catch (e) {}

    apply();

    if (location.hash) {
      var target = document.querySelector(location.hash);
      if (target && target.classList.contains('card')) {
        target.hidden = false;
        setOpen(target, true);
        target.scrollIntoView();
      }
    }
  }

  function unique(a) {
    return a.filter(function (v, i) { return a.indexOf(v) === i; }).sort();
  }

  q.addEventListener('input', apply);
  document.getElementById('reset').addEventListener('click', function () {
    active = { status: [], type: [], tag: [], theme: [] };
    q.value = '';
    apply();
  });
  document.getElementById('expand').addEventListener('click', function () {
    [].forEach.call(list.children, function (c) { if (!c.hidden) setOpen(c, true); });
  });
  document.getElementById('collapse').addEventListener('click', function () {
    [].forEach.call(list.children, function (c) { setOpen(c, false); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; apply(); }
  });

  function lines(text) {
    return text.split('\n').filter(function (l) { return l.trim(); }).map(JSON.parse);
  }

  function grab(name) {
    return fetch(name, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(lines);
  }

  // The live files first. Browsers refuse a file:// fetch, so fall back to the
  // snapshot baked in at build time and say which one is on screen. A missing
  // roadmap.jsonl is not an error: the section just stays hidden.
  grab('issues.jsonl')
    .then(function (data) {
      grab('roadmap.jsonl')
        .catch(function () { return []; })
        .then(function (plan) { draw(data, plan); });
    })
    .catch(function () {
      var snap = JSON.parse(document.getElementById('snapshot').textContent);
      draw(snap.issues, snap.roadmap,
        'Showing the snapshot saved when this page was last built, because the browser would ' +
        'not read the .jsonl files from disk. To see them live, serve the directory ' +
        '(python3 -m http.server) and open it over http, or rebuild this page.');
    });
})();
</script>
</body>
</html>
