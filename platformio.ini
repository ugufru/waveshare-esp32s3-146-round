; waveshare-esp32s3-146-round PlatformIO configuration
; Waveshare ESP32-S3-Touch-LCD-1.46 (ESP32-S3R8, 8 MB octal PSRAM, 16 MB W25Q128 QIO flash).
;
; Toolchain decision and the reasons for each pin: issue 17.
; Every version is pinned exactly. Waveshare's SPD2010 display driver is tested
; only against Arduino-ESP32 3.0.2..3.1.1 with LVGL 8.3.10, so do not float these.
;
;   pio run -t upload   &&   pio device monitor

[platformio]
default_envs = board

[env:board]
; pioarduino community platform: the official espressif32 platform ships only
; Arduino core 2.x. Release 53.03.11 = Arduino-ESP32 3.1.1 on IDF 5.3.2.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
framework = arduino
; Generic S3 board definition, overridden below to match this board.
board = esp32-s3-devkitc-1

; Quad flash + octal PSRAM. Wrong memory type here boot-loops at startup.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; Native USB only (GPIO19/20 straight to USB-C, no UART bridge): serial goes
; over the USB-Serial/JTAG port.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; -DTOUCH_DEBUG  ; log touch status and LVGL press/release changes
    ; LVGL reads include/lv_conf.h (issue 24).
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude

; LVGL 8.3.10 exactly: Waveshare's tested version (issue 17). LVGL 9 is a
; separate, later decision.
lib_deps =
    lvgl/lvgl@8.3.10

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
